function IoDialog({ mode, state, onClose, onApply }) {
  const [text, setText] = useState(() => mode === "out" ? exportState(state) : "");
  const [err, setErr] = useState("");
  const [copied, setCopied] = useState(false);
  const areaRef = useRef(null);

  useEffect(() => {
    if (areaRef.current) {
      areaRef.current.focus();
      if (mode === "out") areaRef.current.select();
    }
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [mode, onClose]);

  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        if (areaRef.current) { areaRef.current.select(); document.execCommand("copy"); done(); }
      });
    } else if (areaRef.current) {
      areaRef.current.select();
      document.execCommand("copy");
      done();
    }
  };

  const apply = () => {
    try {
      onApply(importState(text));
      onClose();
    } catch (e) {
      setErr("Kunne ikke lese teksten. Lim inn en Output-tekst (setninger med Feltnavn: verdi) eller JSON.");
    }
  };

  return (
    <div role="dialog" aria-modal="true" aria-label={mode === "out" ? "Output" : "Input"}
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 100, background: "rgba(16,24,40,.45)",
        display: "flex", alignItems: "center", justifyContent: "center", padding: 24,
      }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: mode === "out" ? "min(640px, 100%)" : "min(560px, 100%)",
        maxHeight: "min(720px, 90vh)",
        background: "#fff", borderRadius: 12, border: "1px solid " + C.border,
        boxShadow: "0 16px 40px rgba(16,24,40,.18)",
        display: "flex", flexDirection: "column", overflow: "hidden",
      }}>
        <div style={{
          padding: "14px 18px 10px", display: "flex", alignItems: "flex-start",
          justifyContent: "space-between", gap: 12, borderBottom: "1px solid " + C.border,
        }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 600, color: C.navy }}>
              {mode === "out" ? "Output" : "Input"}
            </div>
            <Help style={{ marginTop: 2 }}>
              {mode === "out"
                ? "Pedagogiske setninger som avsluttes med Feltnavn: verdi. Kopier og lim inn via Input for å gjenopprette alt."
                : "Lim inn en Output-tekst (eller eldre JSON) for å fylle alle feltene i dashbordet."}
            </Help>
          </div>
          <button type="button" className="lnk" onClick={onClose} aria-label="Lukk">Lukk</button>
        </div>
        <div style={{ padding: 16, flex: 1, minHeight: 0, display: "flex", flexDirection: "column", gap: 8 }}>
          <textarea ref={areaRef} value={text} readOnly={mode === "out"}
            onChange={e => { setText(e.target.value); setErr(""); }}
            spellCheck={mode === "out"}
            style={{
              width: "100%", flex: 1, minHeight: 320, resize: "vertical",
              fontFamily: mode === "out"
                ? "inherit"
                : "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
              fontSize: mode === "out" ? 13.5 : 12,
              lineHeight: mode === "out" ? 1.55 : 1.45,
              color: C.navy,
              border: "1px solid " + C.inputBorder, borderRadius: 8, padding: 14,
              background: mode === "out" ? C.zebra : "#fff",
            }} />
          {err && <div style={{ fontSize: 12, color: C.red }}>{err}</div>}
        </div>
        <div style={{
          padding: "12px 16px", borderTop: "1px solid " + C.border,
          display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 10,
        }}>
          {mode === "out" ? (
            <button type="button" onClick={copy} style={{
              padding: "8px 14px", borderRadius: 6, border: "none", cursor: "pointer",
              background: C.blue, color: "#fff", fontWeight: 600, fontSize: 13, fontFamily: "inherit",
            }}>{copied ? "Kopiert" : "Kopier"}</button>
          ) : (
            <button type="button" onClick={apply} style={{
              padding: "8px 14px", borderRadius: 6, border: "none", cursor: "pointer",
              background: C.blue, color: "#fff", fontWeight: 600, fontSize: 13, fontFamily: "inherit",
            }}>Bruk</button>
          )}
        </div>
      </div>
    </div>
  );
}

function buildAdvSummaryPlain({ s, fullAdv, topPlan, topRate, perLabel, typeName,
  dtiMore, dtiOk, dstiNow, dstiOk, dstiSoft, rentShare, stressRule, stressOk, stressNow,
  startLTV, debtFreeLabel, debtFreeValue, nextStep }) {
  const lines = [];
  const push = (...xs) => lines.push(...xs);
  const today = new Date().toLocaleDateString("nb-NO", { year: "numeric", month: "long", day: "numeric" });

  push("Söderberg & Partners Wealth Management", "Låneoppsummering – Avansert", today, "");

  push("— BETJENINGSEVNE —", "");
  push("Alder: " + s.age + " år");
  push("Mål gjeldfri: " + s.debtFreeAge + " år");
  push("Brutto lønn: " + (s.income > 0 ? nok(s.income) + " / år (" + nok(s.income / 12) + " / mnd)" : "Ikke oppgitt"));
  if (s.income > 0) {
    push("Gjeldsgrad (DTI): " + dtiMore.toFixed(1).replace(".", ",") + "×"
      + (dtiOk ? " (innenfor maks 5×)" : " (over grensen på 5×)"));
    push("Betjeningsgrad (DSTI): " + pct1(dstiNow)
      + (dstiOk ? (dstiSoft ? " (stramt)" : " (innenfor)") : " (over norm)"));
    push("Rentebelastning: " + pct1(rentShare) + " av bruttoinntekt");
    push("Tålegrense (+" + STRESS_RULE + " pp): " + pct1(stressRule.share)
      + (stressOk ? " – tåler økningen" : " – tåler ikke økningen")
      + " (limit " + STRESS_LIMIT + " %)");
    push("Betjening i dag: " + nok(stressNow.paid / Math.max(1, s.ppy)) + " / " + perLabel);
  }
  push("");

  push("— LÅNEDETALJER —", "");
  push("Lånetype: " + typeName);
  push("Grunnlån: " + nok(s.amount));
  push("Nominell rente: " + (s.niborOn
    ? "Nibor-kurve + " + pct(s.niborMargin) + " påslag"
    : s.stepsOn ? "Trinnvis (tegnes i Avansert)" : pct(s.rate)));
  push("Nedbetalingstid: " + s.years + " år (" + s.ppy + " terminer/år)");
  if (s.grace > 0) push("Avdragsfri periode: " + s.grace + " " + s.graceUnit);
  if (s.graceStepsOn) push("Avdragsfrihet underveis: aktiv (tegnes i Avansert)");
  if (s.topAmount > 0) {
    push("Topplån: " + nok(s.topAmount) + " · rente " + pct(topRate));
    push("Samlet lån: " + nok(s.amount + s.topAmount));
  }
  push("Pant / sikkerhet: " + nok(s.assetValue)
    + (s.extraAsset > 0 ? " + tillegg " + nok(s.extraAsset) : ""));
  push("Belåningsgrad nå: " + (startLTV > 0 ? pct1(startLTV) : "—"));
  push("Neste belåningsnivå: " + nextStep);
  push(debtFreeLabel + ": " + debtFreeValue);
  push("Første termin: " + nok(fullAdv.rows[0].term));
  push("Totale renter: " + nok(fullAdv.totalInterest));
  push("Totalt å betale: " + nok(fullAdv.totalPaid));
  if (s.fee || s.setup || s.deed) {
    push("Gebyrer: termingebyr " + nok(s.fee)
      + " · etablering " + nok(s.setup)
      + " · tinglysning " + nok(s.deed));
  }
  push("");

  push("— NEDBETALINGSPLAN PER ÅR —", "");
  push("År\tTerminbeløp\tRenter\tAvdrag\tRestgjeld\tRente");
  fullAdv.years.forEach(y => {
    push(
      (y.year + (y.grace ? " *" : ""))
      + "\t" + nok(y.term)
      + "\t" + nok(y.interest)
      + "\t" + nok(y.principal)
      + "\t" + nok(y.balance)
      + "\t" + pct(y.rate)
    );
  });
  if (fullAdv.years.some(y => y.grace)) push("", "* = år med avdragsfrihet på grunnlånet");
  push("", "Veiledende beregning. Faktiske betingelser avtales med banken.");
  return lines.join("\n");
}

function buildLoanSummaryPlain({ s, base, perLabel, typeName }) {
  const lines = [];
  const push = (...xs) => lines.push(...xs);
  const today = new Date().toLocaleDateString("nb-NO", { year: "numeric", month: "long", day: "numeric" });
  const first = base.rows[0];

  push("Söderberg & Partners Wealth Management", "Låneoppsummering", today, "");
  push("— LÅNET —", "");
  push("Lånetype: " + typeName);
  push("Lånebeløp: " + nok(s.amount));
  push("Nominell rente: " + pct(s.rate));
  push("Effektiv rente: " + pct(base.eff));
  push("Nedbetalingstid: " + s.years + " år (" + s.ppy + " terminer/år)");
  if (s.grace > 0) push("Avdragsfri periode: " + s.grace + " " + s.graceUnit + " (" + base.g + " terminer)");
  else push("Avdragsfri periode: Ingen");
  push("Første terminbeløp: " + nok(first.term) + " / " + perLabel);
  push("Totale renter: " + nok(base.totalInterest));
  push("Gebyrer: " + nok(base.totalFees)
    + " (termingebyr " + nok(s.fee) + " · etablering " + nok(s.setup) + " · tinglysning " + nok(s.deed) + ")");
  push("Totalt å betale: " + nok(base.totalPaid));
  push("");
  push("— NEDBETALINGSPLAN PER ÅR —", "");
  push("År\tTerminbeløp\tRenter\tAvdrag\tRestgjeld");
  base.years.forEach(y => {
    push(
      (y.year + (y.grace ? " *" : ""))
      + "\t" + nok(y.term)
      + "\t" + nok(y.interest)
      + "\t" + nok(y.principal)
      + "\t" + nok(y.balance)
    );
  });
  if (base.years.some(y => y.grace)) push("", "* = år med avdragsfrihet");
  push("", "Veiledende beregning. Faktiske betingelser avtales med banken.");
  return lines.join("\n");
}

function App() {
  const [s, setS] = useState(() => ({ ...DEFAULT_STATE }));
  const [ioMode, setIoMode] = useState(null); /* "in" | "out" | null */
  const [summaryKind, setSummaryKind] = useState(null); /* null | "loan" | "adv" */
  const [niborCurve, setNiborCurve] = useState(() => NIBOR_FALLBACK.map(p => ({ ...p })));
  const up = (k, v) => setS(p => ({ ...p, [k]: v }));

  useEffect(() => {
    let cancelled = false;
    fetch("nibor.txt", { cache: "no-store" })
      .then(r => (r.ok ? r.text() : Promise.reject()))
      .then(text => {
        const parsed = parseNiborText(text);
        if (!cancelled && parsed.length) {
          NIBOR_CURVE = parsed;
          setNiborCurve(parsed);
        }
      })
      .catch(() => { /* behold innebygd kurve ved file:// eller manglende fil */ });
    return () => { cancelled = true; };
  }, []);

  /* Avdragsfriheten kan ikke overleve et bytte av enhet eller kortere løpetid */
  const setGraceUnit = u => setS(p => ({ ...p, graceUnit: u, grace: Math.min(p.grace, graceMaxFor(u, p.years)) }));
  const setYears = y => setS(p => ({
    ...p, years: y, debtFreeAge: p.age + y, grace: Math.min(p.grace, graceMaxFor(p.graceUnit, y)),
  }));
  /* Målet for gjeldfrihet styrer løpetiden: 35 år nå og gjeldfri ved 39 gir 4 år nedbetaling */
  const setDebtFreeAge = d => setS(p => {
    const years = clamp(d - p.age, YEARS_MIN, YEARS_MAX);
    return {
      ...p, years, debtFreeAge: p.age + years, grace: Math.min(p.grace, graceMaxFor(p.graceUnit, years)),
    };
  });
  /* Ny alder flytter målet og beholder løpetiden – ellers ville målet kunne havne i fortiden */
  const setAge = a => setS(p => ({ ...p, age: a, debtFreeAge: a + p.years }));

  const base = buildPlan(s, false);
  const topRate = s.topRate == null ? clamp(s.rate + 2, 0, 15) : s.topRate;
  const pair = buildLoanPair(s, topRate, true);
  const adv = pair.main;
  const topPlan = pair.top;
  const tab = s.tab;

  const n = base.n, g = base.g;
  const perLabel = s.ppy === 12 ? "måned" : "termin";
  const typeName = s.type === "annuitet" ? "annuitetslån" : "serielån";

  /* ---------- fane: kalkulator ---------- */

  const bigLabel = g > 0 ? "Terminbeløp i avdragsfri periode"

  const calcTab = (

      {/* Resultat + graf */}
      <div style={{ display: "flex", flexDirection: "column", gap: 12, minWidth: 0, minHeight: 0 }}>
        <Card pad={0} style={{ flex: "none" }}>
          <div style={{
            display: "grid", gridTemplateColumns: "minmax(0,1fr) auto", gap: 16,
            padding: "16px 20px 14px", alignItems: "start",
          }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12, color: C.text2, marginBottom: 2 }}>{bigLabel}</div>
              <div style={{ fontSize: 38, lineHeight: 1.05, fontWeight: 600, color: C.navy, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
                {nok(firstTerm)}
              </div>
              <div style={{ fontSize: 12, color: C.text, marginTop: 4 }}>{bigSub}</div>
            </div>
            <div style={{ textAlign: "right", paddingLeft: 16, borderLeft: "1px solid " + C.border }}>
              <div style={{ fontSize: 12, color: C.text2, marginBottom: 2 }}>Effektiv rente</div>
              <div style={{ fontSize: 26, fontWeight: 600, color: C.blue, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{pct(base.eff)}</div>
              <div style={{ fontSize: 11.5, color: C.text3 }}>Inkl. gebyrer</div>
            </div>
          </div>
          <Divider />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", padding: "12px 20px 14px", gap: 12 }}>
            {[
              ["Totale renter", nok(base.totalInterest)],
              ["Gebyrer totalt", nok(base.totalFees)],
              ["Totalt å betale", nok(base.totalPaid)],
              ["Siste termin", nok(base.lastTerm)],
            ].map(([l, v]) => (
              <div key={l} style={{ minWidth: 0 }}>
                <div style={{ fontSize: 11, color: C.text2, whiteSpace: "nowrap" }}>{l}</div>

            ))}

  /* ---------- fane: nedbetalingsplan ---------- */
  const planSub = nok(s.amount) + " · " + pct(s.rate) + " · " + s.years + " år · " + typeName
    + " · " + s.ppy + " terminer per år" + (g > 0 ? " · " + g + " avdragsfrie terminer" : "");

  const planTab = (
    <Card pad={0} style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>

            options={[{ v: "year", label: "Per år" }, { v: "month", label: "Per termin" }]} />

      <div style={{
        display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: 1,

      }}>

  /* ---------- fane: grafisk ---------- */

  const graphTab = (
    <div style={{ display: "flex", flexDirection: "column", gap: 12, flex: 1, minHeight: 0 }}>

        <Help>{cumHelp}</Help>
      </Card>

  );

  /* ---------- fane: avansert ---------- */
  const advRows = adv.rows;
  const asset0 = assetAt(s, 0);
  const totalDebt = s.amount + (s.topAmount || 0);
  const startLTV = asset0 > 0 ? totalDebt / asset0 * 100 : 0;
  const ltvPts = advRows.map((r, i) => {
    const a = assetAt(s, i + 1);
    const extra = topPlan && topPlan.rows[i] ? topPlan.rows[i].balance : 0;
    return a > 0 ? (r.balance + extra) / a * 100 : 0;
  });
  const lowStep = LTV_MARKS[LTV_MARKS.length - 1];
  let nextStep = "Under " + lowStep + " % allerede";
  if (startLTV > lowStep) {
    const thr = LTV_MARKS.find(t => t < startLTV);
    const idx = ltvPts.findIndex(v => v <= thr);
    nextStep = idx === -1 ? "Nås ikke i løpetiden"
      : thr + " % ved " + (s.age + Math.ceil((idx + 1) / s.ppy)) + " år";
  }

  /* Utlånsforskriften setter taket for samlet gjeld ved fem ganger brutto årsinntekt */
  const dti = s.income > 0 ? totalDebt / s.income : 0;
  const dtiNote = s.income > 0
    ? "Gjeldsgrad " + dti.toFixed(1).replace(".", ",") + " ganger brutto lønn"
      + (dti > 5 ? " – over grensen på 5 i utlånsforskriften." : " – innenfor grensen på 5 i utlånsforskriften.")
    : "Legg inn brutto lønn for å se gjeldsgraden.";

  /* Målet og løpetiden holdes i takt. Avdragsfrihet på slutten kan gjøre at målet ikke nås. */
  const endBalance = adv.rows.length ? adv.rows[adv.rows.length - 1].balance : 0;
  const debtFreeLabel = endBalance > 0.5 ? "Restgjeld" : "Gjeldfri";
  const debtFreeValue = endBalance > 0.5 ? nok(endBalance) : (s.age + s.years) + " år";
  const debtNote = endBalance > 0.5
    ? "Avdragsfrihet på slutten gir " + nok(endBalance) + " i restgjeld ved utgangen av perioden. "
      + "Løpetiden forlenges ikke utover " + s.years + " år."
    : "Nedbetalingstiden følger målet: " + s.years + " år gir gjeldfrihet ved "
      + s.debtFreeAge + " år, med " + nok(firstTerm) + " per " + perLabel + "."
      + (s.years === YEARS_MAX ? " Kalkulatoren regner med maksimalt " + YEARS_MAX + " års løpetid." : "");

  const advTab = (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, flex: 1, minHeight: 0 }}>
      <div style={{
        display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)",
        gridTemplateRows: "minmax(0,1fr) minmax(0,1fr)", gap: 12, flex: 1, minHeight: 0,
      }}>
        {/* Renteendringer */}
        <Card pad={16} style={{
          gridColumn: 1, gridRow: 1,
          display: "flex", flexDirection: "column", gap: 10, minHeight: 0,
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub="Dra i kurven for å sette renten. Endringen gjelder fra året du tar tak i og ut løpetiden.">
              Renteendringer underveis
            </CardTitle>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flex: "none" }}>
              {s.stepsOn && (
                <button type="button" className="lnk" onClick={() => up("yearRates", null)}>
                  <Icon name="reset" size={15} />Flat rente
                </button>
              )}
              <Switch
                on={s.stepsOn}
                disabled={s.niborOn}
                label="Renteendringer underveis"
                onChange={v => setS(p => ({
                  ...p,
                  stepsOn: v,
                  yearRates: v ? p.yearRates : null,
                  niborOn: v ? false : p.niborOn,
                }))}
              />
            </div>
          </div>
          <RateCurve
            s={s}
            setYearRates={v => up("yearRates", v)}
            disabled={!s.stepsOn}
            disabledHint={s.niborOn
              ? "Deaktivert mens Nibor + påslag er aktiv. Skru av Nibor for å tegne renten manuelt."
              : undefined}
          />
        </Card>

        {/* Avdragsfrihet underveis */}
        <Card pad={16} style={{
          gridColumn: 1, gridRow: 2,
          display: "flex", flexDirection: "column", gap: 10, minHeight: 0,
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub="Dra opp for avdragsfrihet. Valget gjelder fra året du tar tak i og ut løpetiden.">
              Avdragsfrihet underveis
            </CardTitle>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flex: "none" }}>
              {s.graceStepsOn && s.graceYears && (
                <button type="button" className="lnk" onClick={() => up("graceYears", null)}>
                  <Icon name="reset" size={15} />Nullstill
                </button>
              )}
              <Switch on={s.graceStepsOn} onChange={v => up("graceStepsOn", v)} label="Avdragsfrihet underveis" />
            </div>
          </div>
          <GraceCurve s={s} setGraceYears={v => up("graceYears", v)} disabled={!s.graceStepsOn} />
        </Card>

        {/* Nibor + påslag */}
        <Card pad={16} style={{
          gridColumn: 2, gridRow: 1,
          display: "flex", flexDirection: "column", gap: 8, minHeight: 0, overflowY: "auto",
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub="Lånerenten følger Nibor-kurven (3 mnd–10 år) pluss valgt påslag. Etter år 10 brukes 10-års nivået.">
              Nibor + påslag
            </CardTitle>
            <Switch
              on={s.niborOn}
              label="Nibor pluss påslag"
              onChange={v => setS(p => ({
                ...p,
                niborOn: v,
                stepsOn: v ? false : p.stepsOn,
                yearRates: v ? null : p.yearRates,
              }))}
            />
          </div>
          <Slider id="f-nibor-margin" label="Påslag" display={pct(s.niborMargin)}
            value={s.niborMargin} min={0} max={8} step={0.05}
            onChange={v => up("niborMargin", v)}
            minLabel="0,00 %" maxLabel="8,00 %" />
          <NiborCurve s={s} curve={niborCurve} disabled={!s.niborOn} />
        </Card>

        {/* Belåningsgrad over tid */}
        <Card pad={16} style={{
          gridColumn: 2, gridRow: 2,
          display: "flex", flexDirection: "column", gap: 10, minHeight: 0,
        }}>
          <CardTitle>Belåningsgrad over tid</CardTitle>
          <LtvBars plan={adv} extraPlan={topPlan} s={s} startLTV={startLTV} />
          <div style={{
            display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 1,
            background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
          }}>
            <StatCell label="Belåningsgrad nå" value={pct1(startLTV)} />
            <StatCell label="Neste nivå" value={nextStep} />
            <StatCell label={debtFreeLabel} value={debtFreeValue} />
          </div>
          <Help>{debtNote}</Help>
        </Card>
      </div>
    </div>
  );

  /* ---------- fane: tillegg ---------- */
  const topTerm = topPlan ? topPlan.rows[0].term : 0;
  const mainTerm = adv.rows[0].term;
  const topClearIdx = topPlan ? topPlan.rows.findIndex(r => r.balance < 0.5) : -1;
  const topClearLabel = topClearIdx < 0 ? null
    : topClearIdx < s.ppy ? "første året"
    : "år " + Math.ceil((topClearIdx + 1) / s.ppy);
  const stressPoints = STRESS_SHOCKS.map(shock => {
    const svc = stressService(s, topRate, shock);
    const paid = svc.interest + svc.principal;
    return {
      shock,
      interest: svc.interest,
      principal: svc.principal,
      paid,
      share: s.income > 0 ? paid / s.income * 100 : 0,
      grace: svc.grace,
    };
  });
  const stressNow = stressPoints[0];
  const stressRule = stressPoints.find(p => p.shock === STRESS_RULE) || stressPoints[0];
  const stressOk = stressRule.share <= STRESS_LIMIT;
  const stressMonth = s.ppy > 0 ? stressRule.paid / s.ppy : 0;
  const incomeMonth = s.income / 12;
  const dtiMore = s.income > 0 ? totalDebt / s.income : 0;
  const dstiNow = stressNow.share;
  const rentShare = s.income > 0 ? stressNow.interest / s.income * 100 : 0;
  const dtiOk = dtiMore <= 5;
  const dstiOk = dstiNow <= 50;
  const dstiSoft = dstiNow > STRESS_SOFT && dstiNow <= 50;

  const moreTab = (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, flex: 1, minHeight: 0 }}>
      <Help style={{ fontSize: 12, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
        <span style={{ fontWeight: 600, color: C.navy, fontSize: 13 }}>Flere funksjoner. </span>
        Alder, inntekt, sikkerhet, topplån og stresstest av betjeningsevne. Bygger på grunnlån og valgene i Lån Avansert.
      </Help>
      <div style={{
        display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)",
        gridTemplateRows: "minmax(0,0.75fr) minmax(0,1.25fr)", gap: 12, flex: 1, minHeight: 0,
      }}>
        <Card pad={16} style={{
          gridColumn: 1, gridRow: "1 / span 2",
          display: "flex", flexDirection: "column", gap: 10, minHeight: 0, overflowY: "auto",
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub={"Andel av brutto årsinntekt som går til renter og avdrag første året. "
              + "Søylene følger renteøkningen; avdraget faller bort i avdragsfrie perioder."}>
              Stresstest – betjeningsevne
            </CardTitle>
            <Legend items={[
              { label: "Renter", color: C.blue2 },
              { label: "Avdrag", color: C.blue },
            ]} />
          </div>

          {s.income > 0 ? (
            <React.Fragment>
              <StressChart points={stressPoints} income={s.income} />
              <div style={{
                display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 1,
                background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
              }}>
                <StatCell label="I dag" value={pct1(stressNow.share)}
                  sub={nok(stressNow.paid / Math.max(1, s.ppy)) + " / " + perLabel} />
                <StatCell label={"+" + STRESS_RULE + " pp (forskrift)"} value={pct1(stressRule.share)}
                  sub={nok(stressMonth) + " / " + perLabel}
                  accent={stressOk ? C.blue : C.red} />
                <StatCell label="Rom til limit"
                  value={stressOk
                    ? pct1(STRESS_LIMIT - stressRule.share)
                    : "−" + pct1(stressRule.share - STRESS_LIMIT)}
                  accent={stressOk ? C.navy : C.red}
                  last />
              </div>

              <div style={{
                border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden", flex: "none",
              }}>
                <table className="kpi">
                  <thead>
                    <tr>
                      <th>Nøkkeltall</th>
                      <th>Hva det måler</th>
                      <th>Typisk krav</th>
                      <th className="r">Her</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>Gjeldsgrad <span className="muted">(DTI)</span></td>
                      <td>Total gjeld mot brutto inntekt</td>
                      <td>Maks 5× inntekt</td>
                      <td className={"r " + (dtiOk ? "ok" : "bad")}>
                        {dtiMore.toFixed(1).replace(".", ",")}×
                        <div className="muted">{dtiOk ? "Innenfor" : "Over grensen"}</div>
                      </td>
                    </tr>
                    <tr>
                      <td>Betjeningsgrad <span className="muted">(DSTI)</span></td>
                      <td>Renter + avdrag / inntekt</td>
                      <td>Ofte maks 40–50 %</td>
                      <td className={"r " + (dstiOk ? (dstiSoft ? "warn" : "ok") : "bad")}>
                        {pct1(dstiNow)}
                        <div className="muted">
                          {dstiOk ? (dstiSoft ? "Stramt" : "Innenfor") : "Over norm"}
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td>Rentebelastning</td>
                      <td>Kun renter / inntekt</td>
                      <td>Sårbarhet ved rentetopp</td>
                      <td className="r">
                        {pct1(rentShare)}
                        <div className="muted">{nok(stressNow.interest / Math.max(1, s.ppy)) + " / " + perLabel}</div>
                      </td>
                    </tr>
                    <tr>
                      <td>Tålegrense</td>
                      <td>Betjeningsevne ved +{STRESS_RULE} % renteøkning</td>
                      <td>Obligatorisk i bankene</td>
                      <td className={"r " + (stressOk ? "ok" : "bad")}>
                        {pct1(stressRule.share)}
                        <div className="muted">{stressOk ? "Tåler +" + STRESS_RULE + " pp" : "Tåler ikke +" + STRESS_RULE + " pp"}</div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <Help>
                {stressNow.grace
                  ? "Første året er delvis eller helt avdragsfritt, så søylene er rente-tunge. "
                  : "Første året inkluderer både renter og avdrag. "}
                Tallene bygger på samlet lån {nok(totalDebt)} og bruttoinntekt {nok(s.income)}
                {" "}({nok(incomeMonth)} per måned). Betjeningsgrad og tålegrense er målt mot bruttoinntekt.
              </Help>
            </React.Fragment>
          ) : (
            <div style={{
              flex: 1, minHeight: 120, display: "flex", alignItems: "center", justifyContent: "center",
              background: C.zebra, border: "1px solid " + C.border, borderRadius: 8, padding: 24,
            }}>
              <Help style={{ textAlign: "center", fontSize: 13 }}>
                Legg inn brutto lønn per år til høyre for å se stresstesten.
              </Help>
            </div>
          )}
        </Card>

        <Card pad={16} style={{
          gridColumn: 2, gridRow: 1,
          display: "flex", flexDirection: "column", gap: 12, minHeight: 0, overflowY: "auto",
        }}>
          <CardTitle>Alder, gjeldfrihet og sikkerhet</CardTitle>
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 8 }}>
            <NumField id="f-age" small deferred label="Din alder" suffix="år" min={18} max={80}
              value={s.age} onChange={setAge} />
            <NumField id="f-dfa" small deferred label="Gjeldfri ved alder" suffix="år" min={20} max={90}
              value={s.debtFreeAge} onChange={setDebtFreeAge} />
          </div>
          <div>
            <NumField id="f-income" small grouped label="Brutto lønn per år" suffix="kr"
              value={s.income} onChange={v => up("income", v)} />
            <Help style={{ marginTop: 4 }}>{dtiNote}</Help>
          </div>
          <div>
            <Slider id="f-asset" label="Verdi på sikkerheten" display={nok(s.assetValue)}
              value={s.assetValue} min={0} max={70000000} step={100000}
              onChange={v => up("assetValue", v)} minLabel="0 kr" maxLabel="70 000 000 kr" />
            <Help style={{ marginTop: 4 }}>
              Tilleggssikkerhet settes under Topplån nedenfor. Samlet sikkerhet påvirker belåningsgraden.
            </Help>
          </div>
        </Card>

        <Card pad={16} style={{
          gridColumn: 2, gridRow: 2,
          display: "flex", flexDirection: "column", gap: 8, minHeight: 0, overflowY: "auto",
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub="Høyere rente enn grunnlånet – derfor nedbetales topplånet først. Samme løpetid og terminer.">
              Topplån
            </CardTitle>
            {s.topRate != null && (
              <button type="button" className="lnk" onClick={() => up("topRate", null)}>
                <Icon name="reset" size={15} />Grunnlån + 2 %
              </button>
            )}
          </div>
          <Slider id="f-top-amount" label="Topplån" display={nok(s.topAmount)}
            value={s.topAmount} min={0} max={20000000} step={50000}
            onChange={v => up("topAmount", v)}
            minLabel={s.topAmount > 0 ? "Samlet lån " + nok(s.amount + s.topAmount) : "0 kr"}
            maxLabel="20 000 000 kr" />
          <div>
            <Slider id="f-top-rate" label="Nominell rente" display={pct(topRate)}
              value={topRate} min={0} max={15} step={0.05}
              onChange={v => up("topRate", v)}
              minLabel="0,00 %" maxLabel="15,00 %" />
            <Help style={{ marginTop: 4 }}>
              {s.topRate == null
                ? "2 prosentpoeng over grunnlånet på " + pct(s.rate) + ". Avdrag går til topplånet først."
                : "Satt manuelt. Grunnlånet ligger på " + pct(s.rate) + ". Avdrag går til topplånet først."}
              {topClearLabel ? " Topplånet er nedbetalt i " + topClearLabel + "." : ""}
            </Help>
          </div>
          <div style={{ paddingTop: 8, borderTop: "1px solid " + C.border }}>
            <Slider id="f-extra" label="Tilleggssikkerhet" display={nok(s.extraAsset)}
              value={s.extraAsset} min={0} max={10000000} step={100000}
              onChange={v => up("extraAsset", v)} minLabel="0 kr" maxLabel="10 000 000 kr" />
            <div style={{
              marginTop: 8, display: "grid", gridTemplateColumns: "repeat(3,minmax(0,1fr))", gap: 1,
              background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
            }}>
              <StatCell label="Pant" value={nok(s.assetValue)} />
              <StatCell label="Tillegg" value={nok(s.extraAsset)} />
              <StatCell label="Sum sikkerhet" value={nok(s.assetValue + s.extraAsset)} accent={C.blue} last />
            </div>
            <Help style={{ marginTop: 4 }}>
              Pantet settes ovenfor. Sum sikkerhet brukes i belåningsgraden.
            </Help>
          </div>
          {s.topAmount > 0 ? (
            <React.Fragment>
              <div style={{ flex: "1 1 0", minHeight: 0 }} aria-hidden="true" />
              <div style={{ display: "flex", flexDirection: "column", gap: 5, flex: "none" }}>
                <div style={{
                  display: "grid", gridTemplateColumns: "repeat(3,minmax(0,1fr))", gap: 1,
                  background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
                }}>
                  <StatCell compact label={"Topplån per " + perLabel} value={nok(topTerm)} />
                  <StatCell compact label="Renter topplån" value={nok(topPlan.totalInterest)} />
                  <StatCell compact label="Totalt topplån" value={nok(topPlan.totalPaid)} last />
                </div>
                <div style={{
                  display: "grid", gridTemplateColumns: "repeat(3,minmax(0,1fr))", gap: 1,
                  background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
                }}>
                  <StatCell compact label={"Grunnlån per " + perLabel} value={nok(mainTerm)} />
                  <StatCell compact label="Renter grunnlån" value={nok(adv.totalInterest)} />
                  <StatCell compact label="Totalt grunnlån" value={nok(adv.totalPaid)} last />
                </div>
                <div style={{
                  display: "grid", gridTemplateColumns: "repeat(3,minmax(0,1fr))", gap: 1,
                  background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
                }}>
                  <StatCell compact label={"Samlet per " + perLabel} value={nok(mainTerm + topTerm)} accent={C.blue} />
                  <StatCell compact label="Samlede renter" value={nok(adv.totalInterest + topPlan.totalInterest)} accent={C.blue} />
                  <StatCell compact label="Samlet totalt" value={nok(adv.totalPaid + topPlan.totalPaid)} accent={C.blue} last />
                </div>
              </div>
              <div style={{ flex: "3 1 0", minHeight: 0 }} aria-hidden="true" />
            </React.Fragment>
          ) : (
            <Help style={{ marginTop: "auto" }}>
              Dra beløpet opp for å legge inn et topplån ved siden av grunnlånet på {nok(s.amount)}.
            </Help>
          )}
        </Card>
      </div>
    </div>
  );

  /* ---------- fane: plan (avansert) ---------- */
  const fullAdv = mergePlans(adv, topPlan);
  const fullEnd = fullAdv.rows[fullAdv.rows.length - 1].balance;
  const diff = fullAdv.totalPaid - base.totalPaid;
  const diffColor = diff > 0.5 ? C.red : diff < -0.5 ? C.blue : C.text2;
  const diffText = (diff > 0.5 ? "+" : diff < -0.5 ? "−" : "") + nok(Math.abs(diff));
  const advSub = (s.niborOn ? "Nibor + påslag" : s.stepsOn ? "trinnvis rente" : "flat rente")
    + (s.graceStepsOn ? " · tegnet avdragsfrihet" : "")
    + (s.topAmount > 0 ? " · topplån " + nok(s.topAmount) : "")
    + " · " + s.years + " år · " + s.ppy + " terminer per år";

  const summaryPlain = summaryKind === "loan"
    ? buildLoanSummaryPlain({ s, base, perLabel, typeName })
    : summaryKind === "adv"
    ? buildAdvSummaryPlain({
      s, fullAdv, topPlan, topRate, perLabel, typeName,
      dtiMore, dtiOk, dstiNow, dstiOk, dstiSoft, rentShare, stressRule, stressOk, stressNow,
      startLTV, debtFreeLabel, debtFreeValue, nextStep,
    })
    : "";

  const advPlanTab = (
    <Card pad={0} style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ padding: "14px 24px 12px", display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
        <CardTitle size={19} sub={advSub}>Nedbetalingsplan – avansert</CardTitle>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flex: "none" }}>
          <SummaryBtn onClick={() => setSummaryKind("adv")} />
          <Segment grow={false} value={s.view} onChange={v => up("view", v)}
            options={[{ v: "year", label: "Per år" }, { v: "month", label: "Per termin" }]} />
        </div>
      </div>
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 1,
        background: C.border, borderTop: "1px solid " + C.border, borderBottom: "1px solid " + C.border,
      }}>
        <StatCell label="Første termin" value={nok(fullAdv.rows[0].term)} />
        <StatCell label="Totale renter" value={nok(fullAdv.totalInterest)} />
        <StatCell label="Mot grunnplanen" value={diffText} accent={diffColor} />
        {fullEnd > 0.5
          ? <StatCell label="Restgjeld til slutt" value={nok(fullEnd)} accent={C.red} />
          : null}
        <StatCell label="Totalt å betale" value={nok(fullAdv.totalPaid)} accent={C.blue} last />
      </div>
      <PlanTable plan={fullAdv} s={s} view={s.view} showRate />
      <Footnote>
        Planen slår sammen grunnlån og eventuelt topplån. Avdrag går alltid til topplånet først
        (markert i blått med «Topplån»), deretter til grunnlånet. Rentekolonnen er veid rente når lånene
        har ulik rente. «Avdragsfri» gjelder grunnlånet. Avdragsfrihet på slutten gir restgjeld
        i stedet for gjeldfrihet – løpetiden forlenges ikke.
      </Footnote>
    </Card>
  );

  /* ---------- ramme ---------- */
  return (
    <div style={{
      position: "relative",
      height: "100%", background: C.canvas, padding: "14px 20px 16px",
      display: "flex", flexDirection: "column", gap: 12, overflow: "hidden",
    }}>
      <div style={{ maxWidth: 1280, width: "100%", margin: "0 auto", display: "flex", flexDirection: "column", gap: 12, flex: 1, minHeight: 0 }}>

        {/* topplinje */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24, flex: "none" }}>
          <div style={{ display: "flex", alignItems: "center", minWidth: 0 }}>
            <img src={SPWM_LOGO} alt="Söderberg &amp; Partners Wealth Management" style={{ height: 26, display: "block" }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flex: "none" }}>
            <div style={{ display: "flex", gap: 2, background: C.track, borderRadius: 5, padding: 4 }}>
              {tabs.map(t => (
                <button key={t.v} type="button" onClick={() => up("tab", t.v)}
                  aria-pressed={tab === t.v} style={TAB(tab === t.v, t.tone)}>{t.label}</button>
              ))}
            </div>
            <FullscreenButton />
          </div>
        </div>

        {/* innhold */}
        {tab === "home" && <ForsidePanel onStart={() => up("tab", "calc")} />}
        {/* Kalkulatorkortene tar 9/10 av høyden; resten er luft nederst */}
        {tab === "calc" && <React.Fragment>{calcTab}<div style={{ flex: 1, minHeight: 0 }} aria-hidden="true" /></React.Fragment>}
        {tab === "plan" && planTab}
        {tab === "graph" && graphTab}
        {tab === "adv" && advTab}
        {tab === "more" && moreTab}
        {tab === "advplan" && advPlanTab}
      </div>

      <IoCornerBtn label="input" side="left" onClick={() => setIoMode("in")} />
      <IoCornerBtn label="output" side="right" onClick={() => setIoMode("out")} />
      {ioMode && (
        <IoDialog key={ioMode} mode={ioMode} state={s}
          onClose={() => setIoMode(null)}
          onApply={next => setS(next)} />
      )}
      {summaryKind && (
        <AdvSummaryDialog
          onClose={() => setSummaryKind(null)}
          plainText={summaryPlain}
          subtitle={summaryKind === "loan" ? "Lån – til e-post" : "Avansert – til e-post"}
        >
          {summaryKind === "loan" ? (
            <LoanSummaryBody s={s} base={base} perLabel={perLabel} typeName={typeName} />
          ) : (
            <AdvSummaryBody
              s={s} fullAdv={fullAdv} topPlan={topPlan} topRate={topRate}
              perLabel={perLabel} typeName={typeName}
              dtiMore={dtiMore} dtiOk={dtiOk} dstiNow={dstiNow} dstiOk={dstiOk} dstiSoft={dstiSoft}
              rentShare={rentShare} stressRule={stressRule} stressOk={stressOk} stressNow={stressNow}
              startLTV={startLTV} debtFreeLabel={debtFreeLabel} debtFreeValue={debtFreeValue}
              nextStep={nextStep} debtNote={debtNote}
            />
          )}
        </AdvSummaryDialog>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
