<style>
  :root{
    --sp-navy:#002359; --blue-main:#0A5EDC; --blue-pressed:#074EB9;
    --blue-soft:#E8F0FD; --blue-2:#9BC0F5; --violet:#9747FF;
    --gray-25:#FCFCFD; --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#EAECF0;
    --gray-300:#D0D5DD; --gray-400:#98A2B3; --gray-500:#667085; --gray-600:#475467;
    --gray-700:#344054; --gray-900:#101828;
    --secondary-25:#F6F7F9; --secondary-800:#264472; --error-700:#B42318;
    --font-sans:"Hanken Grotesk","Whitney","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:var(--gray-50); color:var(--sp-navy);
    font-family:var(--font-sans); font-size:13px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* Dashbordet er dimensjonert for 1280 × 800. På mindre skjermer beholder det målene
     sine og siden får rullefelt, i stedet for at innholdet blir beskåret. */
  #root{height:100%;min-width:1040px;min-height:660px;}
  button,input,select{font-family:inherit;}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue-main);outline-offset:1px;}

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:10px;border:2px solid var(--gray-50);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- range sliders ---------- */
  .rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:100px;background:var(--gray-200);outline:none;margin:4px 0;display:block;}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--blue-main);box-shadow:0 1px 3px rgba(16,24,40,.16);cursor:pointer;}
  .rng::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:1.5px solid var(--blue-main);box-shadow:0 1px 3px rgba(16,24,40,.16);cursor:pointer;}
  .rng::-moz-range-track{height:4px;border-radius:100px;background:var(--gray-200);}

  /* ---------- number inputs ---------- */
  .num{width:100%;height:32px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;
    padding:0 30px 0 10px;font-size:13.5px;font-weight:500;color:var(--gray-900);
    font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s;}
  .num:focus{border-color:var(--blue-main);box-shadow:0 0 0 3px rgba(10,94,220,.16);outline:none;}
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .num[type=number]{-moz-appearance:textfield;}
  .sel{width:100%;height:32px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;
    padding:0 32px 0 10px;font-size:13.5px;font-weight:500;color:var(--gray-900);
    -webkit-appearance:none;appearance:none;cursor:pointer;}
  .sel:focus{border-color:var(--blue-main);box-shadow:0 0 0 3px rgba(10,94,220,.16);outline:none;}

  /* ---------- tables ---------- */
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{position:sticky;top:0;z-index:1;background:var(--gray-50);
    font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);
    text-align:right;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--gray-200);}
  .tbl td{font-size:12.5px;color:var(--sp-navy);text-align:right;padding:7px 10px;white-space:nowrap;
    font-variant-numeric:tabular-nums;border-bottom:1px solid var(--gray-100);}
  .tbl th.l,.tbl td.l{text-align:left;}
  .tbl tbody tr:hover td{background:#F5F9FF;}
  .tbl tfoot td{position:sticky;bottom:0;z-index:1;background:#fff;font-weight:600;font-size:12.5px;
    border-top:1px solid var(--gray-200);border-bottom:none;box-shadow:0 -1px 0 var(--gray-200);}
  .tbl tbody tr:hover tfoot td{background:#fff;}

  .lnk{background:none;border:none;padding:0;cursor:pointer;color:var(--blue-main);
    font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .lnk:hover{color:var(--blue-pressed);}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ============================================================================
   Farger og tokens
   ========================================================================== */
const C = {
  navy: "#002359", blue: "#0A5EDC", blueDark: "#074EB9", blueSoft: "#E8F0FD",
  blue2: "#9BC0F5", violet: "#9747FF", canvas: "#F9FAFB", border: "#EAECF0",
  inputBorder: "#D0D5DD", text: "#475467", text2: "#667085", text3: "#98A2B3",
  strong: "#101828", label: "#344054", zebra: "#FCFCFD", track: "#F6F7F9",
  sec800: "#264472", red: "#B42318",
};

/* ============================================================================
   Formattering (nb-NO)
   ========================================================================== */
const grp = n => {
  const neg = n < 0;
  const s = Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (neg ? "−" : "") + s;
};
const nok = v => grp(Number.isFinite(v) ? v : 0) + " kr";
const pct = v => (Number.isFinite(v) ? v : 0).toFixed(2).replace(".", ",") + " %";
const pct1 = v => (Number.isFinite(v) ? v : 0).toFixed(1).replace(".", ",") + " %";
const pct0 = v => Math.round(Number.isFinite(v) ? v : 0) + " %";

/* ============================================================================
   Beregningsmotor
   ========================================================================== */
const termCount = s => Math.max(1, Math.round(s.years * s.ppy));

function yearRateList(s) {
  return Array.from({ length: s.years }, (_, y) => {
    if (s.yearRates && s.yearRates[y] != null) return s.yearRates[y];
    if (s.yearRates && s.yearRates.length) return s.yearRates[s.yearRates.length - 1];
    return s.rate;
  });
}

function rateSeries(s, adv) {
  const n = termCount(s);
  if (!adv || !s.stepsOn) return new Array(n).fill(s.rate);
  const per = yearRateList(s);
  return Array.from({ length: n }, (_, m) => per[Math.min(per.length - 1, Math.floor(m / s.ppy))]);
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* Løpetiden kan velges fra 1 til 30 år */
const YEARS_MIN = 1, YEARS_MAX = 30;

/* Maks avdragsfrihet: 10 år / 120 mnd, men aldri hele løpetiden */
function graceMaxFor(unit, years) {
  return unit === "år"
    ? Math.max(0, Math.min(10, years - 1))
    : Math.max(0, Math.min(120, Math.round(years * 12) - 1));
}

function graceTerms(s) {
  const t = s.graceUnit === "år" ? s.grace * s.ppy : Math.round(s.grace * s.ppy / 12);
  return Math.max(0, Math.min(Math.round(t), Math.max(0, termCount(s) - 1)));
}

/* Avdragsfriheten fra Kalkulator-fanen, sett per år: et år er avdragsfritt
   så snart første termin i året er det */
function graceFieldYears(s) {
  const g = graceTerms(s);
  return Array.from({ length: s.years }, (_, y) => y * s.ppy < g);
}

/* Avdragsfrihet per år i Avansert-fanen. Uten en tegnet kurve gjelder feltet i Kalkulator-fanen. */
function graceYearList(s) {
  if (!s.graceYears) return graceFieldYears(s);
  return Array.from({ length: s.years }, (_, y) => {
    if (s.graceYears[y] != null) return !!s.graceYears[y];
    if (s.graceYears.length) return !!s.graceYears[s.graceYears.length - 1];
    return false;
  });
}

/* Sammenhengende år med samme valg slås sammen, som for rentekurven */
function graceSegments(list) {
  const out = [];
  list.forEach((on, i) => {
    const last = out[out.length - 1];
    if (last && last.on === on) last.end = i;
    else out.push({ on, start: i, end: i });
  });
  return out;
}

function graceSeries(s, adv) {
  const n = termCount(s);
  if (!adv || !s.graceStepsOn) {
    const g = graceTerms(s);
    return Array.from({ length: n }, (_, m) => m < g);
  }
  const per = graceYearList(s);
  return Array.from({ length: n }, (_, m) => per[Math.min(per.length - 1, Math.floor(m / s.ppy))]);
}

function assetAt(s, term) {
  if (s.scenario === "fall") return s.assetValue * 0.9;
  if (s.scenario === "growth") return s.assetValue * Math.pow(1.02, term / s.ppy);
  return s.assetValue;
}

/* Rentetrappen: renten settes ned 0,25 prosentpoeng for hvert nivå lånet faller under */
const RATE_STEPS = [85, 75, 60];
const stepText = RATE_STEPS.map(t => t + " %").join(", ").replace(/, (\d+ %)$/, " og $1");

function ltvDiscount(s, balance, term, adv) {
  if (!adv || !s.ltvOn) return 0;
  const a = assetAt(s, term);
  if (!(a > 0)) return 0;
  const ltv = balance / a * 100;
  return RATE_STEPS.filter(t => ltv <= t).length * 0.25;
}

function schedule(s, adv) {
  const n = termCount(s);
  const rates = rateSeries(s, adv);
  const gr = graceSeries(s, adv);
  /* En avdragsfri termin er en pause: restgjelden står stille, så nedbetalingen
     regnes mot terminene som faktisk har avdrag – uansett hvor de ligger */
  const amortLeft = new Array(n + 2).fill(0);
  for (let m = n; m >= 1; m--) amortLeft[m] = amortLeft[m + 1] + (gr[m - 1] ? 0 : 1);
  const amortN = Math.max(1, amortLeft[1]);
  let balance = s.amount, ann = 0, prevGrace = true;
  const rows = [];
  for (let m = 1; m <= n; m++) {
    const eff = Math.max(0, rates[m - 1] - ltvDiscount(s, balance, m - 1, adv));
    const r = eff / 100 / s.ppy;
    const interest = balance * r;
    let principal = 0;
    if (!gr[m - 1]) {
      const left = Math.max(1, amortLeft[m]);
      if (s.type === "annuitet") {
        if (prevGrace || rates[m - 1] !== rates[m - 2]) {
          ann = r > 0 ? balance * r / (1 - Math.pow(1 + r, -left)) : balance / left;
        }
        principal = ann - interest;
      } else {
        principal = s.amount / amortN;
      }
    }
    prevGrace = gr[m - 1];
    if (m === n || principal > balance) principal = balance;
    if (principal < 0) principal = 0;
    balance -= principal;
    rows.push({
      m, interest, principal, term: interest + principal + s.fee,
      balance: Math.max(0, balance), grace: gr[m - 1],
      rate: rates[m - 1], effRate: eff,
    });
  }
  return rows;
}

/* Effektiv rente — binærsøk (80 iterasjoner) på IRR, deretter annualisert */
function effectiveRate(rows, net, ppy) {
  if (!(net > 0)) return 0;
  const f = i => rows.reduce((a, r, k) => a + r.term / Math.pow(1 + i, k + 1), 0) - net;
  if (f(0) <= 0) return 0;
  let lo = 0, hi = 1;
  for (let k = 0; k < 80; k++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) lo = mid; else hi = mid;
  }
  const i = (lo + hi) / 2;
  const out = (Math.pow(1 + i, ppy) - 1) * 100;
  return Number.isFinite(out) ? out : 0;
}

function buildPlan(s, adv) {
  const rows = schedule(s, adv);
  const n = rows.length;
  const totalInterest = rows.reduce((a, r) => a + r.interest, 0);
  const totalFees = n * s.fee + s.setup + s.deed;
  const totalPaid = rows.reduce((a, r) => a + r.term, 0) + s.setup + s.deed;
  const lastTerm = rows[n - 1].term;
  const eff = effectiveRate(rows, s.amount - s.setup - s.deed, s.ppy);

  const years = [];
  for (let y = 0; y * s.ppy < n; y++) {
    const chunk = rows.slice(y * s.ppy, (y + 1) * s.ppy);
    years.push({
      year: y + 1, chunk,
      interest: chunk.reduce((a, r) => a + r.interest, 0),
      principal: chunk.reduce((a, r) => a + r.principal, 0),
      term: chunk.reduce((a, r) => a + r.term, 0),
      balance: chunk[chunk.length - 1].balance,
      grace: chunk.some(r => r.grace),
      rate: chunk.reduce((a, r) => a + r.effRate, 0) / chunk.length,
    });
  }
  const g = rows.reduce((a, r) => a + (r.grace ? 1 : 0), 0);
  return { rows, n, g, totalInterest, totalFees, totalPaid, lastTerm, eff, years };
}

/* Tabellrader — samme funksjon for begge visninger */
function makeTable(plan, s, view) {
  const one = s.setup + s.deed;
  if (view === "year") {
    return plan.years.map((y, i) => {
      const fees = y.chunk.length * s.fee + (i === 0 ? one : 0);
      return {
        key: "y" + y.year, year: y.year,
        termin: y.chunk.length === 1 ? String(y.chunk[0].m)
          : y.chunk[0].m + "–" + y.chunk[y.chunk.length - 1].m,
        rate: y.rate, principal: y.principal, interest: y.interest, fees,
        total: y.term + (i === 0 ? one : 0),
        balance: y.balance, balancePct: s.amount > 0 ? y.balance / s.amount * 100 : 0,
        isGrace: y.grace, bg: y.year % 2 === 0 ? C.zebra : "#fff",
      };
    });
  }
  return plan.rows.map((r, i) => {
    const year = Math.ceil(r.m / s.ppy);
    return {
      key: "m" + r.m, year, termin: String(r.m), rate: r.effRate,
      principal: r.principal, interest: r.interest,
      fees: s.fee + (i === 0 ? one : 0),
      total: r.term + (i === 0 ? one : 0),
      balance: r.balance, balancePct: s.amount > 0 ? r.balance / s.amount * 100 : 0,
      isGrace: r.grace, bg: year % 2 === 0 ? C.zebra : "#fff",
    };
  });
}

/* Sammenhengende år med samme rente slås sammen til segmenter */
function rateSegments(list) {
  const out = [];
  list.forEach((r, i) => {
    const last = out[out.length - 1];
    if (last && Math.abs(last.rate - r) < 1e-9) last.end = i;
    else out.push({ rate: r, start: i, end: i });
  });
  return out;
}

function NumField({ id, label, value, onChange, suffix, step = 1, min = 0, max, small, grouped, title, deferred }) {
  /* deferred: felt som styrer andre verdier venter på et tall innenfor min/max,
     slik at halvskrevne tall som «3» på vei til «39» ikke utløser beregningen */
  const [draft, setDraft] = useState(null);
  const type = raw => {
    if (!deferred) return onChange(Math.max(0, +raw || 0));
    const v = +raw;
    if (raw !== "" && Number.isFinite(v) && v >= min && (max == null || v <= max)) { setDraft(null); onChange(v); }
    else setDraft(raw);

  const commit = () => {
    if (draft === null) return;

  return (
    <div style={{ minWidth: 0 }}>

          : <input id={id} className="num" type="number" value={draft !== null ? draft : value}
            step={step} min={min} max={max} title={title || undefined}
            onChange={e => type(e.target.value)} onBlur={commit}
            onKeyDown={e => { if (e.key === "Enter") commit(); }} />}

/* ============================================================================
   Rentekurve — dragbar
   ========================================================================== */
function RateCurve({ s, setYearRates, disabled }) {
  const boxRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  /* Året man griper og rentebanen slik den var før grepet, slik at dragingen
     bare flytter nivået på dette trinnet og lar tidligere trinn stå */
  const fromRef = useRef(0);
  const baseRef = useRef(null);
  const list = disabled ? new Array(s.years).fill(s.rate) : yearRateList(s);
  const segs = rateSegments(list);

  const paint = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const cs = window.getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const padT = parseFloat(cs.paddingTop) || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    const w = rect.width - padL - padR, h = rect.height - padT - padB;
    if (!(w > 0) || !(h > 0)) return;
    const x = e.clientX - rect.left - padL;
    const y = e.clientY - rect.top - padT;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    let r = (1 - y / h) * 15;
    if (!Number.isFinite(r)) return;
    r = Math.max(0, Math.min(15, Math.round(r / 0.05) * 0.05));
    /* En renteendring varer ut løpetiden – ellers ville renten hoppet tilbake etter ett år */
    const next = (baseRef.current || list).slice();
    for (let i = fromRef.current; i < next.length; i++) next[i] = r;
    setYearRates(next);
  };

  const grab = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return;
    const cs = window.getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const w = rect.width - padL - (parseFloat(cs.paddingRight) || 0);
    if (!(w > 0)) return;
    const x = e.clientX - rect.left - padL;
    if (!Number.isFinite(x)) return;
    fromRef.current = Math.max(0, Math.min(s.years - 1, Math.floor(x / w * s.years)));
    baseRef.current = list.slice();
  };

  const labels = segs
    .map(sg => ({ ...sg, span: sg.end - sg.start + 1 }))
    .filter(sg => sg.span / s.years >= 0.16)
    .sort((a, b) => b.span - a.span)
    .slice(0, 3);

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, gap: 6 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 44, flex: "none", display: "flex", flexDirection: "column",
          justifyContent: "space-between", fontSize: 10, color: C.text3, textAlign: "right",
          padding: "0 0 2px",
        }}>
          <span>15,00 %</span><span>7,50 %</span><span>0 %</span>
        </div>
        <div ref={boxRef}
          onPointerDown={disabled ? undefined : e => {
            e.currentTarget.setPointerCapture?.(e.pointerId);
            setDragging(true); grab(e); paint(e);
          }}
          onPointerMove={disabled ? undefined : e => { if (dragging) paint(e); }}
          onPointerUp={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          onPointerLeave={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          style={{
            flex: 1, minWidth: 0, position: "relative", background: C.zebra,
            border: "1px solid " + C.border, borderRadius: 8, padding: 8,
            display: "flex", alignItems: "flex-end", gap: 3,
            touchAction: "none", userSelect: "none", cursor: disabled ? "default" : "ns-resize",
          }}>
          {list.map((r, i) => (
            <div key={i} title={disabled ? undefined : "År " + (i + 1) + " · " + pct(r)}
              style={{
                flex: 1, minWidth: 0, height: Math.max(0, r / 15 * 100) + "%",
                background: disabled ? "#F4F6F8" : C.blueSoft,
                borderTop: "3px solid " + (disabled ? C.inputBorder : C.blue),
              }} />
          ))}
          {disabled && (
            <div style={{
              position: "absolute", left: 0, right: 0, top: "38%", textAlign: "center",
              fontSize: 12, color: C.text2, pointerEvents: "none", padding: "0 24px",
            }}>

/* Avdragsfrihet tegnes med samme grep som renten, men kurven har bare to nivåer:
   du tar tak i et år og drar opp eller ned, og valget gjelder derfra og ut løpetiden */
function GraceCurve({ s, setGraceYears, disabled }) {
  const boxRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const fromRef = useRef(0);
  const baseRef = useRef(null);
  const list = disabled ? graceFieldYears(s) : graceYearList(s);
  const segs = graceSegments(list);

  const paint = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const cs = window.getComputedStyle(el);
    const padT = parseFloat(cs.paddingTop) || 0;
    const h = rect.height - padT - (parseFloat(cs.paddingBottom) || 0);
    if (!(h > 0)) return;
    const y = e.clientY - rect.top - padT;
    if (!Number.isFinite(y)) return;
    const on = 1 - y / h >= 0.5;
    const next = (baseRef.current || list).slice();
    for (let i = fromRef.current; i < next.length; i++) next[i] = on;
    setGraceYears(next);
  };

  const grab = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return;
    const cs = window.getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const w = rect.width - padL - (parseFloat(cs.paddingRight) || 0);
    if (!(w > 0)) return;
    const x = e.clientX - rect.left - padL;
    if (!Number.isFinite(x)) return;
    fromRef.current = Math.max(0, Math.min(s.years - 1, Math.floor(x / w * s.years)));
    baseRef.current = list.slice();
  };

  const on = segs.filter(sg => sg.on);
  const count = list.reduce((a, v) => a + (v ? 1 : 0), 0);
  const spans = on.map(sg => "år " + (sg.start + 1) + (sg.end > sg.start ? "–" + (sg.end + 1) : ""));
  const lastAmort = list.lastIndexOf(false) + 1;
  /* Løpetiden ligger fast, så avdragene presses inn i årene som har avdrag.
     Er de siste årene avdragsfrie, er lånet altså nedbetalt før pausen starter. */
  const note = (count === 0
    ? "Ingen avdragsfrihet – avdrag fra første termin."
    : "Avdragsfri " + (spans.length <= 4 ? spans.join(" · ") : count + " av " + s.years + " år") + ". "
      + (count === s.years
        ? "Ingen avdrag underveis – hele lånet forfaller på siste termin."
        : list[list.length - 1]
          ? "Avdragene tas før pausen, så lånet er nedbetalt ved utgangen av år " + lastAmort + "."
          : "Avdragene fordeles på de " + (s.years - count) + " årene med avdrag."))
    /* Kurven gjelder bare denne fanen, så si fra når den setter feltet til side */
    + (!disabled && s.graceYears && graceTerms(s) > 0
      ? " Overstyrer de " + s.grace + " " + s.graceUnit + " i Kalkulator-fanen." : "");

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, gap: 6 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 44, flex: "none", display: "flex", flexDirection: "column",
          justifyContent: "space-between", fontSize: 9.5, color: C.text3, textAlign: "right",
          padding: "0 0 2px",
        }}>
          <span>Avdragsfri</span><span>Avdrag</span>
        </div>
        <div ref={boxRef}
          onPointerDown={disabled ? undefined : e => {
            e.currentTarget.setPointerCapture?.(e.pointerId);
            setDragging(true); grab(e); paint(e);
          }}
          onPointerMove={disabled ? undefined : e => { if (dragging) paint(e); }}
          onPointerUp={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          onPointerLeave={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          style={{
            flex: 1, minWidth: 0, position: "relative", background: C.zebra,
            border: "1px solid " + C.border, borderRadius: 8, padding: 8,
            display: "flex", alignItems: "flex-end", gap: 3,
            touchAction: "none", userSelect: "none", cursor: disabled ? "default" : "ns-resize",
          }}>
          {list.map((v, i) => (
            <div key={i} title={disabled ? undefined : "År " + (i + 1) + " · " + (v ? "avdragsfri" : "med avdrag")}
              style={{
                flex: 1, minWidth: 0, height: v ? "100%" : "10%",
                background: disabled ? "#F4F6F8" : v ? C.blueSoft : C.track,
                borderTop: "3px solid " + (disabled ? C.inputBorder : v ? C.blue : C.inputBorder),
              }} />
          ))}
          {disabled && (
            <div style={{
              position: "absolute", left: 0, right: 0, top: "38%", textAlign: "center",
              fontSize: 12, color: C.text2, pointerEvents: "none", padding: "0 24px",
            }}>
              Slå på for å velge avdragsfrihet fra et valgt år og ut løpetiden.<br />
              {graceTerms(s) > 0
                ? "Grunnplanen har " + s.grace + " " + s.graceUnit + " avdragsfrihet."
                : "Grunnplanen har avdrag fra første termin."}
            </div>
          )}
          <div style={{ position: "absolute", inset: 8, pointerEvents: "none" }}>
            {!disabled && on.filter(sg => (sg.end - sg.start + 1) / s.years >= 0.18).map(sg => (
              <div key={sg.start} style={{
                position: "absolute", top: 7,
                left: sg.start / s.years * 100 + "%",
                width: (sg.end - sg.start + 1) / s.years * 100 + "%",
                textAlign: "center", fontSize: 11.5, fontWeight: 600, color: C.blue, whiteSpace: "nowrap",
              }}>Avdragsfri</div>
            ))}
          </div>
        </div>
      </div>
      <div style={{ paddingLeft: 52 }}><YearAxis years={s.years} /></div>
      <Help style={{ paddingLeft: 52 }}>{note}</Help>
    </div>
  );
}

/* ============================================================================
   Søylediagram — belåningsgrad per år
   ========================================================================== */
/* Nivåene lånet er verdt å følge med på */
const LTV_MARKS = [90, 80, 60];

function LtvBars({ plan, s, startLTV }) {
  const data = plan.years.map((y, i) => {
    const a = assetAt(s, (i + 1) * s.ppy);
    return { year: i + 1, age: s.age + i + 1, ltv: a > 0 ? y.balance / a * 100 : 0 };
  });
  const top = Math.max(100, startLTV, ...data.map(d => d.ltv));
  const H = v => Math.max(0, Math.min(1, v / top)) * 100;
  const band = v => v > 90 ? C.navy : v > 80 ? C.blue : v > 60 ? C.blue2 : C.blueSoft;

  /* Året lånet først faller under hvert nivå. Merkelappen henges på nivålinjen,
     så to nivåer som passeres samme år ikke legger seg oppå hverandre. */
  const crossings = [];
  LTV_MARKS.forEach(mark => {
    if (startLTV <= mark) return;
    const i = data.findIndex(d => d.ltv <= mark);
    if (i >= 0) crossings.push({ mark, i, age: data[i].age });
  });
  const crossYears = new Set(crossings.map(c => c.i));

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style={{
        position: "relative", flex: 1, minHeight: 96, display: "flex", alignItems: "flex-end",
        gap: data.length > 20 ? 2 : 4, borderBottom: "1px solid " + C.inputBorder,
      }}>
        {LTV_MARKS.map(t => (
          <div key={t} style={{
            position: "absolute", left: 0, right: 0, bottom: H(t) + "%",
            borderTop: "1px dashed " + C.inputBorder, pointerEvents: "none",
          }} />
        ))}
        {data.map((d, i) => (
          <div key={d.year} title={"År " + d.year + " · " + d.age + " år · " + pct1(d.ltv)}
            style={{
              flex: 1, minWidth: 0, height: H(d.ltv) + "%", borderRadius: "3px 3px 0 0",
              background: band(d.ltv),
              /* ringen må vises både på de mørke og de lyse søylene */
              boxShadow: crossYears.has(i)
                ? "inset 0 0 0 1.5px " + (d.ltv > 80 ? "#fff" : C.navy) : "none",
            }} />
        ))}
        {LTV_MARKS.map(t => (
          <div key={"m" + t} style={{
            position: "absolute", right: 0, bottom: H(t) + "%", transform: "translateY(50%)",
            background: "#fff", padding: "0 3px", fontSize: 10.5, fontWeight: 600,
            color: C.text3, whiteSpace: "nowrap", pointerEvents: "none",
          }}>{t} %</div>
        ))}
        {crossings.map(c => {
          const end = (c.i + 0.5) / data.length > 0.78;
          return (
            <div key={"c" + c.mark} style={{
              position: "absolute", bottom: H(c.mark) + "%",
              ...(end
                ? { right: 26, transform: "translateY(50%)" }
                : { left: ((c.i + 0.5) / data.length * 100) + "%", transform: "translate(-50%, 50%)" }),
              background: "#fff", border: "1px solid " + C.blue2, borderRadius: 100,
              padding: "1px 7px", fontSize: 10.5, fontWeight: 600, color: C.blue,
              whiteSpace: "nowrap", pointerEvents: "none",
            }}>{c.mark} % ved {c.age} år</div>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: C.text3, marginTop: 4 }}>
        <span>{s.age} år</span><span>{s.age + s.years} år</span>
      </div>
    </div>
  );
}

          </div>
        </Card>

        <Card pad={16} style={{ flex: 1, display: "flex", flexDirection: "column", gap: 10, minHeight: 0 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <CardTitle>Renter og avdrag per år</CardTitle>
            <Legend items={[{ label: "Renter", color: C.blue2 }, { label: "Avdrag", color: C.blue }]} />
          </div>
          <StackedBars plan={base} />
        </Card>
      </div>
    </div>
  );

  /* ---------- fane: nedbetalingsplan ---------- */
  const planSub = nok(s.amount) + " · " + pct(s.rate) + " · " + s.years + " år · " + typeName
    + " · " + s.ppy + " terminer per år" + (g > 0 ? " · " + g + " avdragsfrie terminer" : "");

  const planTab = (
    <Card pad={0} style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ padding: "14px 24px 12px", display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
        <CardTitle size={19} sub={planSub}>Nedbetalingsplan</CardTitle>
        <Segment grow={false} value={s.view} onChange={v => up("view", v)}
          options={[{ v: "year", label: "Per år" }, { v: "month", label: "Per termin" }]} />
      </div>
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: 1,
        background: C.border, borderTop: "1px solid " + C.border, borderBottom: "1px solid " + C.border,
      }}>
        <StatCell label="Lånebeløp" value={nok(s.amount)} />
        <StatCell label="Totale renter" value={nok(base.totalInterest)} />
        <StatCell label="Gebyrer" value={nok(base.totalFees)} />
        <StatCell label="Totalt å betale" value={nok(base.totalPaid)} accent={C.blue} last />
      </div>
      <PlanTable plan={base} s={s} view={s.view} showRate={false} />
      <Footnote>
        Beregningen forutsetter fast nominell rente gjennom hele løpetiden. Etablerings- og
        tinglysningsgebyr er lagt inn i gebyrene på første termin. Faktiske betingelser avtales med banken.
      </Footnote>
    </Card>
  );

  /* ---------- fane: grafisk ---------- */
  const firstShare = base.years[0] ? base.years[0].interest / base.years[0].term * 100 : 0;
  const lastY = base.years[base.years.length - 1];
  const lastShare = lastY && lastY.term > 0 ? lastY.interest / lastY.term * 100 : 0;

  const graphTab = (
    <div style={{ display: "flex", flexDirection: "column", gap: 12, flex: 1, minHeight: 0 }}>
      <Card pad={16} style={{ flex: 1.35, display: "flex", flexDirection: "column", gap: 8, minHeight: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
          <CardTitle>Restgjeld over tid</CardTitle>
          <Legend items={[{ label: "Restgjeld", color: C.blue }, { label: "Betalt totalt", color: C.violet }]} />
        </div>
        <DebtBars plan={base} s={s} />
      </Card>

      <Card pad={16} style={{ flex: 1, display: "flex", flexDirection: "column", gap: 10, minHeight: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
          <CardTitle>Hva terminbeløpet går til</CardTitle>
          <Legend items={[{ label: "Renter", color: C.blue2 }, { label: "Avdrag", color: C.blue }]} />
        </div>
        <StackedBars plan={base} normalize />
        <Help>
          Første år går {pct0(firstShare)} av terminbeløpet til renter. Siste år er andelen {pct0(lastShare)}.
        </Help>
      </Card>
    </div>
  );

  /* ---------- fane: avansert ---------- */
  const advRows = adv.rows;
  const startLTV = s.assetValue > 0 ? s.amount / assetAt(s, 0) * 100 : 0;
  const ltvPts = advRows.map((r, i) => {
    const a = assetAt(s, i + 1);
    return a > 0 ? r.balance / a * 100 : 0;
  });
  const lowStep = RATE_STEPS[RATE_STEPS.length - 1];
  let nextStep = "Under " + lowStep + " % allerede";
  if (startLTV > lowStep) {
    const thr = RATE_STEPS.find(t => t < startLTV);
    const idx = ltvPts.findIndex(v => v <= thr);
    nextStep = idx === -1 ? "Nås ikke i løpetiden"
      : thr + " % ved " + (s.age + Math.ceil((idx + 1) / s.ppy)) + " år";
  }

  /* Utlånsforskriften setter taket for samlet gjeld ved fem ganger brutto årsinntekt */
  const dti = s.income > 0 ? s.amount / s.income : 0;
  const dtiNote = s.income > 0
    ? "Gjeldsgrad " + dti.toFixed(1).replace(".", ",") + " ganger brutto lønn"
      + (dti > 5 ? " – over grensen på 5 i utlånsforskriften." : " – innenfor grensen på 5 i utlånsforskriften.")
    : "Legg inn brutto lønn for å se gjeldsgraden.";

  /* Målet og løpetiden holdes i takt, så merknaden bekrefter hva valget koster */
  const debtNote = "Nedbetalingstiden følger målet: " + s.years + " år gir gjeldfrihet ved "
    + s.debtFreeAge + " år, med " + nok(firstTerm) + " per " + perLabel + "."
    + (s.years === YEARS_MAX ? " Kalkulatoren regner med maksimalt " + YEARS_MAX + " års løpetid." : "");

  const advTab = (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, flex: 1, minHeight: 0 }}>
      <Help style={{ fontSize: 12, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
        <span style={{ fontWeight: 600, color: C.navy, fontSize: 13 }}>Avanserte funksjoner. </span>
        Renteendringer og avdragsfrihet underveis, alder og gjeldfrihet, belåningsgrad og rentetrapp. Endringene her vises i «Plan (avansert)».
      </Help>

      <div style={{
        display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)",
        gridTemplateRows: "minmax(0,1fr) minmax(0,1fr)", gap: 12, flex: 1, minHeight: 0,
      }}>
        {/* Renteendringer */}
        <Card pad={16} style={{
          display: "flex", flexDirection: "column", gap: 10, minHeight: 0,
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub="Dra i kurven for å sette renten. Endringen gjelder fra året du tar tak i og ut løpetiden.">
              Renteendringer underveis
            </CardTitle>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flex: "none" }}>
              {s.stepsOn && (
                <button type="button" className="lnk" onClick={() => up("yearRates", null)}>
                  <Icon name="reset" size={15} />Flat rente
                </button>
              )}
              <Switch on={s.stepsOn} onChange={v => up("stepsOn", v)} label="Renteendringer underveis" />
            </div>
          </div>
          <RateCurve s={s} setYearRates={v => up("yearRates", v)} disabled={!s.stepsOn} />
        </Card>

        {/* Alder, gjeldfrihet, sikkerhet + rentetrapp */}
        <Card pad={16} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div>
            <CardTitle>Alder, gjeldfrihet og sikkerhet</CardTitle>
            <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 8, marginTop: 8 }}>
              <NumField id="f-age" small deferred label="Din alder" suffix="år" min={18} max={80}
                value={s.age} onChange={setAge} />
              <NumField id="f-dfa" small deferred label="Gjeldfri ved alder" suffix="år" min={20} max={90}
                value={s.debtFreeAge} onChange={setDebtFreeAge} />
            </div>
            <div style={{ marginTop: 8 }}>
              <NumField id="f-income" small grouped label="Brutto lønn per år" suffix="kr"
                value={s.income} onChange={v => up("income", v)} />
              <Help style={{ marginTop: 4 }}>{dtiNote}</Help>
            </div>
            <div style={{ marginTop: 10 }}>
              <Slider id="f-asset" label="Verdi på sikkerheten" display={nok(s.assetValue)}
                value={s.assetValue} min={0} max={70000000} step={100000}
                onChange={v => up("assetValue", v)} minLabel="0 kr" maxLabel="70 000 000 kr" />
            </div>
          </div>
          <Divider />
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub={"Banker priser i trapper. Renten settes ned 0,25 % for hvert nivå lånet faller under: " + stepText + " av verdien."}>
              Rentetrapp ved lavere belåningsgrad
            </CardTitle>
            <Switch on={s.ltvOn} onChange={v => up("ltvOn", v)} label="Rentetrapp ved lavere belåningsgrad" />
          </div>
        </Card>

        {/* Avdragsfrihet underveis */}
        <Card pad={16} style={{ display: "flex", flexDirection: "column", gap: 10, minHeight: 0 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <CardTitle sub="Dra opp for avdragsfrihet. Valget gjelder fra året du tar tak i og ut løpetiden.">
              Avdragsfrihet underveis
            </CardTitle>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flex: "none" }}>
              {s.graceStepsOn && s.graceYears && (
                <button type="button" className="lnk" onClick={() => up("graceYears", null)}>
                  <Icon name="reset" size={15} />Nullstill
                </button>
              )}
              <Switch on={s.graceStepsOn} onChange={v => up("graceStepsOn", v)} label="Avdragsfrihet underveis" />
            </div>
          </div>
          <GraceCurve s={s} setGraceYears={v => up("graceYears", v)} disabled={!s.graceStepsOn} />
        </Card>

        {/* Belåningsgrad over tid */}
        <Card pad={16} style={{ gridColumn: 2, gridRow: 2, display: "flex", flexDirection: "column", gap: 10, minHeight: 0 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <CardTitle>Belåningsgrad over tid</CardTitle>
            <Segment grow={false} value={s.scenario} onChange={v => up("scenario", v)}
              options={[{ v: "fall", label: "Fall 10 %" }, { v: "flat", label: "Uendret" }, { v: "growth", label: "+2 % p.a." }]} />
          </div>
          <LtvBars plan={adv} s={s} startLTV={startLTV} />
          <div style={{
            display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 1,
            background: C.border, border: "1px solid " + C.border, borderRadius: 8, overflow: "hidden",
          }}>
            <StatCell label="Belåningsgrad nå" value={pct1(startLTV)} />
            <StatCell label="Neste rentetrapp" value={nextStep} />
            <StatCell label="Gjeldfri" value={(s.age + s.years) + " år"} />
          </div>
          <Help>{debtNote}</Help>
        </Card>
      </div>
    </div>
  );

  /* ---------- fane: plan (avansert) ---------- */
  const diff = adv.totalPaid - base.totalPaid;
  const diffColor = diff > 0.5 ? C.red : diff < -0.5 ? C.blue : C.text2;
  const diffText = (diff > 0.5 ? "+" : diff < -0.5 ? "−" : "") + nok(Math.abs(diff));
  const advSub = (s.stepsOn ? "trinnvis rente" : "flat rente")
    + (s.ltvOn ? " · rentetrapp etter belåningsgrad" : "")
    + (s.graceStepsOn ? " · tegnet avdragsfrihet" : "")
    + " · " + s.years + " år · " + s.ppy + " terminer per år";

  const advPlanTab = (
    <Card pad={0} style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ padding: "14px 24px 12px", display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
        <CardTitle size={19} sub={advSub}>Nedbetalingsplan – avansert</CardTitle>
        <Segment grow={false} value={s.view} onChange={v => up("view", v)}
          options={[{ v: "year", label: "Per år" }, { v: "month", label: "Per termin" }]} />
      </div>
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: 1,
        background: C.border, borderTop: "1px solid " + C.border, borderBottom: "1px solid " + C.border,
      }}>
        <StatCell label="Første termin" value={nok(adv.rows[0].term)} />
        <StatCell label="Totale renter" value={nok(adv.totalInterest)} />
        <StatCell label="Mot grunnplanen" value={diffText} accent={diffColor} />
        <StatCell label="Totalt å betale" value={nok(adv.totalPaid)} accent={C.blue} last />
      </div>
      <PlanTable plan={adv} s={s} view={s.view} showRate />
      <Footnote>
        Rentekolonnen viser renten som faktisk er brukt i terminen, inkludert renteendringer du har lagt
        inn og eventuell rentetrapp etter belåningsgrad.
      </Footnote>
    </Card>
  );

  /* ---------- ramme ---------- */
  return (
    <div style={{
      height: "100%", background: C.canvas, padding: "14px 20px 16px",
      display: "flex", flexDirection: "column", gap: 12, overflow: "hidden",
    }}>
      <div style={{ maxWidth: 1280, width: "100%", margin: "0 auto", display: "flex", flexDirection: "column", gap: 12, flex: 1, minHeight: 0 }}>

        {/* topplinje */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24, flex: "none" }}>
          <img src={SPWM_LOGO} alt="Söderberg &amp; Partners Wealth Management" style={{ height: 26, display: "block" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 10, flex: "none" }}>
            <div style={{ display: "flex", gap: 2, background: C.track, borderRadius: 5, padding: 4 }}>
              {tabs.map(t => (
                <button key={t.v} type="button" onClick={() => up("tab", t.v)}
                  aria-pressed={tab === t.v} style={TAB(tab === t.v)}>{t.label}</button>
              ))}
            </div>
            <FullscreenButton />
          </div>
        </div>

        {/* tittel */}
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 32, flex: "none" }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: ".08em", color: C.text2, textTransform: "uppercase" }}>Lånekalkulator</div>
            <h1 style={{
              margin: "2px 0 0", fontSize: 27, lineHeight: 1.1, fontWeight: 500,
              letterSpacing: "-.02em", color: C.navy, whiteSpace: "nowrap",
            }}>Regn ut hva lånet koster</h1>
          </div>
          <div style={{ fontSize: 12, lineHeight: 1.5, color: C.text, maxWidth: 560, textAlign: "right" }}>
            Juster lånebeløp, rente og nedbetalingstid, og se månedskostnad, totale renter og full
            nedbetalingsplan. Kalkulatoren gir en veiledende beregning.
          </div>
        </div>

        {/* innhold */}
        {/* Kalkulatorkortene tar 9/10 av høyden; resten er luft nederst */}
        {tab === "calc" && <React.Fragment>{calcTab}<div style={{ flex: 1, minHeight: 0 }} aria-hidden="true" /></React.Fragment>}
        {tab === "plan" && planTab}
        {tab === "graph" && graphTab}
        {tab === "adv" && advTab}
        {tab === "advplan" && advPlanTab}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
