<style>
  :root{
    --sp-navy:#002359; --blue-main:#0A5EDC; --blue-pressed:#074EB9;
    --blue-soft:#E8F0FD; --blue-2:#9BC0F5; --violet:#9747FF;
    --gray-25:#FCFCFD; --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#EAECF0;
    --gray-300:#D0D5DD; --gray-400:#98A2B3; --gray-500:#667085; --gray-600:#475467;
    --gray-700:#344054; --gray-900:#101828;
    --secondary-25:#F6F7F9; --secondary-800:#264472; --error-700:#B42318;
    --font-sans:"Hanken Grotesk","Whitney","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:var(--gray-50); color:var(--sp-navy);
    font-family:var(--font-sans); font-size:13px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* Dashbordet er dimensjonert for 1280 × 800. På mindre skjermer beholder det målene
     sine og siden får rullefelt, i stedet for at innholdet blir beskåret. */
  #root{height:100%;min-width:1040px;min-height:660px;}
  button,input,select{font-family:inherit;}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue-main);outline-offset:1px;}

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:10px;border:2px solid var(--gray-50);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- range sliders ---------- */
  .rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:100px;background:var(--gray-200);outline:none;margin:4px 0;display:block;}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--blue-main);box-shadow:0 1px 3px rgba(16,24,40,.16);cursor:pointer;}
  .rng::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:1.5px solid var(--blue-main);box-shadow:0 1px 3px rgba(16,24,40,.16);cursor:pointer;}
  .rng::-moz-range-track{height:4px;border-radius:100px;background:var(--gray-200);}

  /* ---------- number inputs ---------- */
  .num{width:100%;height:32px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;
    padding:0 30px 0 10px;font-size:13.5px;font-weight:500;color:var(--gray-900);
    font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s;}
  .num:focus{border-color:var(--blue-main);box-shadow:0 0 0 3px rgba(10,94,220,.16);outline:none;}
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .num[type=number]{-moz-appearance:textfield;}
  .sel{width:100%;height:32px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;
    padding:0 32px 0 10px;font-size:13.5px;font-weight:500;color:var(--gray-900);
    -webkit-appearance:none;appearance:none;cursor:pointer;}
  .sel:focus{border-color:var(--blue-main);box-shadow:0 0 0 3px rgba(10,94,220,.16);outline:none;}

  /* ---------- tables ---------- */
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{position:sticky;top:0;z-index:1;background:var(--gray-50);
    font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);
    text-align:right;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--gray-200);}
  .tbl td{font-size:12.5px;color:var(--sp-navy);text-align:right;padding:7px 10px;white-space:nowrap;
    font-variant-numeric:tabular-nums;border-bottom:1px solid var(--gray-100);}
  .tbl th.l,.tbl td.l{text-align:left;}
  .tbl tbody tr:hover td{background:#F5F9FF;}
  .tbl tfoot td{position:sticky;bottom:0;z-index:1;background:#fff;font-weight:600;font-size:12.5px;
    border-top:1px solid var(--gray-200);border-bottom:none;box-shadow:0 -1px 0 var(--gray-200);}
  .tbl tbody tr:hover tfoot td{background:#fff;}

  .lnk{background:none;border:none;padding:0;cursor:pointer;color:var(--blue-main);
    font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .lnk:hover{color:var(--blue-pressed);}

  /* ---------- nøkkeltall i stresstest ---------- */
  .kpi{width:100%;border-collapse:collapse;}
  .kpi th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);
    text-align:left;padding:6px 8px;border-bottom:1px solid var(--gray-200);background:var(--gray-50);white-space:nowrap;}
  .kpi th.r,.kpi td.r{text-align:right;}
  .kpi td{font-size:11.5px;color:var(--sp-navy);padding:7px 8px;border-bottom:1px solid var(--gray-100);
    vertical-align:top;line-height:1.35;}
  .kpi td.r{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  .kpi tr:last-child td{border-bottom:none;}
  .kpi .muted{color:var(--gray-500);font-weight:400;font-size:10.5px;}
  .kpi .ok{color:var(--blue-main);}
  .kpi .warn{color:#B54708;}
  .kpi .bad{color:var(--error-700);}

  /* ---------- forside ---------- */
  @keyframes forside-in{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .forside-in{animation:forside-in .5s ease-out both;}
  .forside-in-2{animation:forside-in .5s ease-out .1s both;}
  .forside-in-3{animation:forside-in .5s ease-out .2s both;}
  .forside-chart{animation:forside-in .8s ease-out .15s both;}
  .forside-cta{transition:background .15s,box-shadow .15s;}
  .forside-cta:hover{background:var(--blue-pressed) !important;box-shadow:0 4px 14px rgba(10,94,220,.28);}
  .forside-cta:active{background:#063F96 !important;}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>

  const t = String(raw == null ? "" : raw).replace("%", "").replace(/\s/g, "").replace(",", ".");
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : null;
}

function parseNiborText(text) {
  const best = new Map(); /* years -> { years, rate, name, date, priority } */
  String(text || "").split(/\r?\n/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.charAt(0) === "#") return;
    const parts = trimmed.split(/\t+/);
    if (parts.length < 2) return;
    const name = parts[0].trim();
    const rate = parsePctNo(parts[1]);
    if (rate == null) return;
    const date = (parts[2] || "").trim();
    const match = NIBOR_LABEL_YEARS.find(m => m.re.test(name));
    if (!match) return;
    const prev = best.get(match.years);
    if (!prev || match.priority > prev.priority) {
      best.set(match.years, { years: match.years, rate, name, date, priority: match.priority });
    }
  });
  return Array.from(best.values())
    .map(({ years, rate, name, date }) => ({ years, rate, name, date }))
    .sort((a, b) => a.years - b.years);
}

function interpolateNibor(points, tYears) {
  const pts = (points && points.length ? points : NIBOR_FALLBACK).slice().sort((a, b) => a.years - b.years);
  if (tYears <= pts[0].years) return pts[0].rate;
  if (tYears >= pts[pts.length - 1].years) return pts[pts.length - 1].rate;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (tYears >= a.years && tYears <= b.years) {
      const u = (tYears - a.years) / (b.years - a.years);
      return a.rate + u * (b.rate - a.rate);
    }
  }
  return pts[pts.length - 1].rate;
}

/* Per låneår: kurven ved 1…10 år + påslag. Etter år 10 holdes 10-års nivået. */
function niborYearList(s, points) {
  const margin = Number(s.niborMargin) || 0;
  const curve = points || NIBOR_CURVE;
  return Array.from({ length: s.years }, (_, y) => {
    const t = Math.min(y + 1, 10);
    return interpolateNibor(curve, t) + margin;
  });
}

function rateSeries(s, adv) {
  const n = termCount(s);
  if (!adv) return new Array(n).fill(s.rate);
  if (s.niborOn) {
    const per = niborYearList(s);
    return Array.from({ length: n }, (_, m) => per[Math.min(per.length - 1, Math.floor(m / s.ppy))]);
  }
  if (!s.stepsOn) return new Array(n).fill(s.rate);
  const per = yearRateList(s);
  return Array.from({ length: n }, (_, m) => per[Math.min(per.length - 1, Math.floor(m / s.ppy))]);
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* Løpetiden kan velges fra 1 til 30 år */
const YEARS_MIN = 1, YEARS_MAX = 30;

/* Maks avdragsfrihet: 10 år / 120 mnd, men aldri hele løpetiden */
function graceMaxFor(unit, years) {
  return unit === "år"
    ? Math.max(0, Math.min(10, years - 1))
    : Math.max(0, Math.min(120, Math.round(years * 12) - 1));
}

function graceTerms(s) {
  const t = s.graceUnit === "år" ? s.grace * s.ppy : Math.round(s.grace * s.ppy / 12);
  return Math.max(0, Math.min(Math.round(t), Math.max(0, termCount(s) - 1)));
}

/* Avdragsfriheten fra Kalkulator-fanen, sett per år: et år er avdragsfritt
   så snart første termin i året er det */
function graceFieldYears(s) {
  const g = graceTerms(s);
  return Array.from({ length: s.years }, (_, y) => y * s.ppy < g);
}

/* Avdragsfrihet per år i Avansert-fanen. Uten en tegnet kurve gjelder feltet i Kalkulator-fanen. */
function graceYearList(s) {
  if (!s.graceYears) return graceFieldYears(s);
  return Array.from({ length: s.years }, (_, y) => {
    if (s.graceYears[y] != null) return !!s.graceYears[y];
    if (s.graceYears.length) return !!s.graceYears[s.graceYears.length - 1];
    return false;
  });
}

/* Sammenhengende år med samme valg slås sammen, som for rentekurven */
function graceSegments(list) {
  const out = [];
  list.forEach((on, i) => {
    const last = out[out.length - 1];
    if (last && last.on === on) last.end = i;
    else out.push({ on, start: i, end: i });
  });
  return out;
}

function graceSeries(s, adv) {
  const n = termCount(s);
  if (!adv || !s.graceStepsOn) {
    const g = graceTerms(s);
    return Array.from({ length: n }, (_, m) => m < g);
  }
  const per = graceYearList(s);
  return Array.from({ length: n }, (_, m) => per[Math.min(per.length - 1, Math.floor(m / s.ppy))]);
}

/* Tilleggssikkerhet legges til pantet når belåningsgraden regnes */
function assetAt(s, term) {
  return s.assetValue + (s.extraAsset || 0);
}

/* Rentetrappen: renten settes ned 0,25 prosentpoeng for hvert nivå lånet faller under */
const RATE_STEPS = [85, 75, 60];

function ltvDiscount(s, balance, term, adv) {
  if (!adv || !s.ltvOn) return 0;
  const a = assetAt(s, term);
  if (!(a > 0)) return 0;
  const ltv = balance / a * 100;
  return RATE_STEPS.filter(t => ltv <= t).length * 0.25;
}

function schedule(s, adv) {
  const n = termCount(s);
  const rates = rateSeries(s, adv);
  const gr = graceSeries(s, adv);
  /* Antall terminer med avdrag. Serielån fordeler hele lånebeløpet jevnt
     over disse (f.eks. 2 år avdragsfritt + 23 år → like avdrag i 23 år).
     Annuitet beregnes mot gjenstående kalenderterminer når avdrag starter.
     Ligger avdragsfrihet på slutten uten nok avdragsterminer foran, kan
     restgjeld bli stående. */
  const paying = gr.reduce((a, on) => a + (on ? 0 : 1), 0);
  let balance = s.amount, ann = 0, prevGrace = true;
  const rows = [];
  for (let m = 1; m <= n; m++) {
    const eff = Math.max(0, rates[m - 1] - ltvDiscount(s, balance, m - 1, adv));
    const r = eff / 100 / s.ppy;
    const interest = balance * r;
    let principal = 0;
    if (!gr[m - 1]) {
      const left = n - m + 1;
      if (s.type === "annuitet") {
        if (prevGrace || rates[m - 1] !== rates[m - 2]) {
          ann = r > 0 ? balance * r / (1 - Math.pow(1 + r, -left)) : balance / left;
        }
        principal = ann - interest;
      } else {
        principal = paying > 0 ? s.amount / paying : 0;
      }
    }
    prevGrace = gr[m - 1];
    if (principal > balance) principal = balance;
    /* Siste termin nuller bare restgjelden når den faktisk har avdrag.
       Avdragsfrihet på slutten lar gjelden stå – du blir ikke gjeldfri. */
    if (m === n && !gr[m - 1]) principal = balance;
    if (principal < 0) principal = 0;
    balance -= principal;
    rows.push({
      m, interest, principal, term: interest + principal + s.fee,
      balance: Math.max(0, balance), grace: gr[m - 1],
      rate: rates[m - 1], effRate: eff,
    });
  }
  return rows;
}

/* Topplån har høyere rente og får alt avdrag før grunnlånet. Terminbeløpet
   dekker renter på begge pluss det samlede avdraget fra to parallelle planer;
   avdraget fordeles til topplånet først. Når topplånet er borte, går hele
   avdraget til grunnlånet. */
function schedulePriority(s, topRate, adv) {
  const mainRef = schedule(s, adv);
  const topRef = schedule({
    ...s, amount: s.topAmount, rate: Math.max(0, topRate),
    stepsOn: false, yearRates: null, graceStepsOn: false, graceYears: null,
    grace: 0, fee: 0, setup: 0, deed: 0,
  }, false);
  const n = mainRef.length;
  const rates = rateSeries(s, adv);
  const topPct = Math.max(0, topRate);
  const rTop = topPct / 100 / s.ppy;

  let mainBal = s.amount, topBal = s.topAmount;
  const mainRows = [], topRows = [];

  for (let m = 1; m <= n; m++) {
    const debt = mainBal + topBal;
    const effMain = Math.max(0, rates[m - 1] - ltvDiscount(s, debt, m - 1, adv));
    const rMain = effMain / 100 / s.ppy;
    const iMain = mainBal * rMain;
    const iTop = topBal * rTop;
    const grace = mainRef[m - 1].grace;

    let avail = mainRef[m - 1].principal + topRef[m - 1].principal;
    if (avail < 0) avail = 0;

    /* Alltid topplån først: så lenge topplånet har restgjeld, går hele
       avdragsrommet dit. Først når topplånet er null, går avdrag til grunnlånet. */
    let pTop = 0, pMain = 0;
    if (topBal > 0.5) {
      pTop = Math.min(topBal, avail);
      const left = avail - pTop;
      if (topBal - pTop < 0.5 && left > 0) pMain = Math.min(mainBal, left);
    } else {
      pMain = Math.min(mainBal, avail);
    }

    if (m === n && !grace) {
      pTop = topBal;
      pMain = mainBal;
    }
    if (pTop < 0) pTop = 0;
    if (pMain < 0) pMain = 0;

    mainBal = Math.max(0, mainBal - pMain);
    topBal = Math.max(0, topBal - pTop);

    mainRows.push({
      m, interest: iMain, principal: pMain, term: iMain + pMain + s.fee,
      balance: mainBal, grace, rate: rates[m - 1], effRate: effMain,
    });
    topRows.push({
      m, interest: iTop, principal: pTop, term: iTop + pTop,
      balance: topBal, grace: false, rate: topPct, effRate: topPct,
    });
  }
  return { mainRows, topRows };
}

/* Effektiv rente — binærsøk (80 iterasjoner) på IRR, deretter annualisert */
function effectiveRate(rows, net, ppy) {
  if (!(net > 0)) return 0;
  const f = i => rows.reduce((a, r, k) => a + r.term / Math.pow(1 + i, k + 1), 0) - net;
  if (f(0) <= 0) return 0;
  let lo = 0, hi = 1;
  for (let k = 0; k < 80; k++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) lo = mid; else hi = mid;
  }
  const i = (lo + hi) / 2;
  const out = (Math.pow(1 + i, ppy) - 1) * 100;
  return Number.isFinite(out) ? out : 0;
}

function buildPlanFromRows(rows, s, amount) {
  const n = rows.length;
  const totalInterest = rows.reduce((a, r) => a + r.interest, 0);
  const totalFees = n * s.fee + s.setup + s.deed;
  const totalPaid = rows.reduce((a, r) => a + r.term, 0) + s.setup + s.deed;
  const lastTerm = rows[n - 1].term;
  const eff = effectiveRate(rows, amount - s.setup - s.deed, s.ppy);

  const years = [];
  for (let y = 0; y * s.ppy < n; y++) {
    const chunk = rows.slice(y * s.ppy, (y + 1) * s.ppy);
    years.push({
      year: y + 1, chunk,
      interest: chunk.reduce((a, r) => a + r.interest, 0),
      principal: chunk.reduce((a, r) => a + r.principal, 0),
      term: chunk.reduce((a, r) => a + r.term, 0),
      balance: chunk[chunk.length - 1].balance,
      grace: chunk.some(r => r.grace),
      rate: chunk.reduce((a, r) => a + r.effRate, 0) / chunk.length,
    });
  }
  const g = rows.reduce((a, r) => a + (r.grace ? 1 : 0), 0);
  return {
    rows, n, g, totalInterest, totalFees, totalPaid, lastTerm, eff, years,
    amount, feePerTerm: s.fee, setupDeed: s.setup + s.deed,
  };
}

function buildPlan(s, adv) {
  return buildPlanFromRows(schedule(s, adv), s, s.amount);
}

/* Grunnlån + topplån med avdragsprioritet til topplånet */
function buildLoanPair(s, topRate, adv) {
  const main = buildPlan(s, adv);
  if (!(s.topAmount > 0)) return { main, top: null };
  const topS = { ...s, fee: 0, setup: 0, deed: 0 };
  const { mainRows, topRows } = schedulePriority(s, topRate, adv);
  return {
    main: buildPlanFromRows(mainRows, s, s.amount),
    top: buildPlanFromRows(topRows, topS, s.topAmount),
  };
}

/* Slår sammen grunnlån og topplån til én plan for Plan (avansert) */
function mergePlans(main, top) {
  if (!top) return main;
  const rows = main.rows.map((r, i) => {
    const t = top.rows[i] || {
      interest: 0, principal: 0, term: 0, balance: 0, grace: false, rate: 0, effRate: 0,
    };
    const mb = r.balance + r.principal;
    const tb = t.balance + t.principal;
    const effRate = mb + tb > 0 ? (r.effRate * mb + t.effRate * tb) / (mb + tb) : r.effRate;
    return {
      m: r.m,
      interest: r.interest + t.interest,
      principal: r.principal + t.principal,
      term: r.term + t.term,
      balance: r.balance + t.balance,
      mainBal: r.balance,
      topBal: t.balance,
      grace: r.grace,
      rate: effRate,
      effRate,
      /* True mens topplånet fortsatt får avdrag denne terminen */
      topPay: (t.principal || 0) > 0.5,
    };
  });
  const n = rows.length;
  const totalInterest = rows.reduce((a, r) => a + r.interest, 0);
  const totalFees = main.totalFees + top.totalFees;
  const totalPaid = rows.reduce((a, r) => a + r.term, 0) + main.setupDeed;
  const lastTerm = rows[n - 1].term;
  const years = [];
  const ppy = Math.max(1, Math.round(n / main.years.length));
  for (let y = 0; y * ppy < n; y++) {
    const chunk = rows.slice(y * ppy, (y + 1) * ppy);
    const last = chunk[chunk.length - 1];
    years.push({
      year: y + 1, chunk,
      interest: chunk.reduce((a, r) => a + r.interest, 0),
      principal: chunk.reduce((a, r) => a + r.principal, 0),
      term: chunk.reduce((a, r) => a + r.term, 0),
      balance: last.balance,
      mainBal: last.mainBal,
      topBal: last.topBal,
      grace: chunk.some(r => r.grace),
      rate: chunk.reduce((a, r) => a + r.effRate, 0) / chunk.length,
      topPay: chunk.some(r => r.topPay),
    });
  }
  return {
    rows, n, g: main.g, totalInterest, totalFees, totalPaid, lastTerm,
    eff: main.eff, years,
    amount: main.amount + top.amount,
    feePerTerm: main.feePerTerm + top.feePerTerm,
    setupDeed: main.setupDeed,
  };
}

/* Tabellrader — samme funksjon for begge visninger */
function makeTable(plan, s, view) {
  const startAmount = plan.amount != null ? plan.amount : s.amount;
  const feePer = plan.feePerTerm != null ? plan.feePerTerm : s.fee;
  const one = plan.setupDeed != null ? plan.setupDeed : (s.setup + s.deed);
  const pctOf = v => startAmount > 0 ? Math.max(0, v) / startAmount * 100 : 0;
  const splitBal = row => {
    if (row.mainBal == null && row.topBal == null) return {};
    return {
      topPct: pctOf(row.topBal || 0),
      mainPct: pctOf(row.mainBal != null ? row.mainBal : row.balance),
    };
  };
  if (view === "year") {
    return plan.years.map((y, i) => {
      const fees = y.chunk.length * feePer + (i === 0 ? one : 0);
      const isTop = !!y.topPay;
      return {
        key: "y" + y.year, year: y.year,
        termin: y.chunk.length === 1 ? String(y.chunk[0].m)
          : y.chunk[0].m + "–" + y.chunk[y.chunk.length - 1].m,
        rate: y.rate, principal: y.principal, interest: y.interest, fees,
        total: y.term + (i === 0 ? one : 0),
        balance: y.balance, balancePct: pctOf(y.balance),
        topBalance: y.topBal != null ? y.topBal : null,
        isGrace: y.grace, isTop,
        bg: isTop ? C.blueSoft : (y.year % 2 === 0 ? C.zebra : "#fff"),
        ...splitBal(y),
      };
    });
  }
  return plan.rows.map((r, i) => {
    const year = Math.ceil(r.m / s.ppy);
    const isTop = !!r.topPay;
    return {
      key: "m" + r.m, year, termin: String(r.m), rate: r.effRate,
      principal: r.principal, interest: r.interest,
      fees: feePer + (i === 0 ? one : 0),
      total: r.term + (i === 0 ? one : 0),
      balance: r.balance, balancePct: pctOf(r.balance),
      topBalance: r.topBal != null ? r.topBal : null,
      isGrace: r.grace, isTop,
      bg: isTop ? C.blueSoft : (year % 2 === 0 ? C.zebra : "#fff"),
      ...splitBal(r),
    };
  });
}

/* Stresstest: renteøkning på toppen av Avansert-planen (grunnlån + topplån) */
const STRESS_SHOCKS = [0, 1, 2, 3, 4, 5];
const STRESS_SOFT = 40;
const STRESS_LIMIT = 60;
const STRESS_RULE = 3;

function shiftLoanRates(s, shock) {
  const next = { ...s, rate: Math.max(0, s.rate + shock) };
  if (next.yearRates) next.yearRates = next.yearRates.map(r => Math.max(0, r + shock));
  return next;
}

/* Renter og avdrag første året – gebyr holdes utenfor, siden det er lønnens evne til å betjene lånet */
function year1Service(plan) {
  const y = plan.years[0];
  return { interest: y.interest, principal: y.principal, grace: y.grace };
}

function stressService(s, topRate, shock) {
  const shifted = shiftLoanRates(s, shock);
  const pair = buildLoanPair(shifted, Math.max(0, topRate + shock), true);
  const main = year1Service(pair.main);
  if (!pair.top) return main;
  const top = year1Service(pair.top);
  return {
    interest: main.interest + top.interest,
    principal: main.principal + top.principal,
    grace: main.grace,
  };
}

/* Sammenhengende år med samme rente slås sammen til segmenter */
function rateSegments(list) {
  const out = [];
  list.forEach((r, i) => {
    const last = out[out.length - 1];
    if (last && Math.abs(last.rate - r) < 1e-9) last.end = i;
    else out.push({ rate: r, start: i, end: i });
  });
  return out;
}

      style={{ display: "block", flex: "none", ...style }}>
      {(Array.isArray(d) ? d : [d]).map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
}

function FullscreenButton() {
  const [on, setOn] = useState(false);
  const [hover, setHover] = useState(false);

  useEffect(() => {
    const sync = () => setOn(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", sync);
    return () => document.removeEventListener("fullscreenchange", sync);
  }, []);

  const toggle = () => {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } else {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
    }
  };

  const label = on ? "Avslutt fullskjerm" : "Vis i fullskjerm";
  return (
    <button type="button" onClick={toggle} title={label} aria-label={label} aria-pressed={on}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        width: 34, height: 34, flex: "none", borderRadius: 100, cursor: "pointer",
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        border: "1px solid " + (hover ? C.blue : C.border),
        background: hover ? C.blueSoft : "#fff",
        color: hover || on ? C.blue : C.navy,
        boxShadow: "0 1px 2px rgba(16,24,40,.05)",
        transition: "background .15s, border-color .15s, color .15s",
      }}>
      <Icon name={on ? "exitFullscreen" : "fullscreen"} size={17} />
    </button>
  );
}

function NumField({ id, label, value, onChange, suffix, step = 1, min = 0, max, small, grouped, title, deferred }) {
  /* deferred: felt som styrer andre verdier venter på et tall innenfor min/max,
     slik at halvskrevne tall som «3» på vei til «39» ikke utløser beregningen */
  const [draft, setDraft] = useState(null);
  const type = raw => {
    if (!deferred) return onChange(Math.max(0, +raw || 0));
    const v = +raw;
    if (raw !== "" && Number.isFinite(v) && v >= min && (max == null || v <= max)) { setDraft(null); onChange(v); }
    else setDraft(raw);
  };
  const commit = () => {
    if (draft === null) return;
    const v = draft === "" ? min : clamp(+draft || min, min, max == null ? Infinity : max);
    setDraft(null);
    onChange(v);
  };
  return (
    <div style={{ minWidth: 0 }}>
      {label && (
        <FieldLabel htmlFor={id} style={{ fontSize: small ? 11.5 : 12.5, marginBottom: 4 }}>
          <span title={title || undefined} style={{ whiteSpace: "nowrap" }}>{label}</span>
        </FieldLabel>
      )}
      <div style={{ position: "relative", minWidth: 0 }}>
        {grouped
          ? <input id={id} className="num" type="text" inputMode="numeric" value={grp(value)} title={title || undefined}
            onChange={e => onChange(Math.max(0, +e.target.value.replace(/[^\d]/g, "") || 0))} />
          : <input id={id} className="num" type="number" value={draft !== null ? draft : value}
            step={step} min={min} max={max} title={title || undefined}
            onChange={e => type(e.target.value)} onBlur={commit}
            onKeyDown={e => { if (e.key === "Enter") commit(); }} />}
        {suffix && <span style={{
          position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)",
          fontSize: 12, color: C.text3, pointerEvents: "none",
        }}>{suffix}</span>}
      </div>
    </div>
  );
}

function Slider({ id, label, display, value, min, max, step, onChange, minLabel, maxLabel, editable, editAs = "int" }) {
  const [draft, setDraft] = useState(null);
  const formatDraft = v => editAs === "pct"
    ? (Number.isFinite(v) ? v : 0).toFixed(2).replace(".", ",")
    : grp(v);
  const parseDraft = raw => {
    if (editAs === "pct") return parsePctNo(raw);
    const digits = String(raw == null ? "" : raw).replace(/[^\d]/g, "");
    return digits === "" ? null : +digits;
  };
  const commitEdit = raw => {
    const n = parseDraft(raw);
    setDraft(null);
    onChange(clamp(n == null ? value : n, min, max));
  };
  const valueStyle = {
    fontSize: 18, fontWeight: 600, color: C.navy, fontVariantNumeric: "tabular-nums",
    whiteSpace: "nowrap", textAlign: "right", fontFamily: "inherit",
  };
  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 8 }}>
        <FieldLabel htmlFor={editable ? id + "-num" : id}>{label}</FieldLabel>
        {editable
          ? <input
              id={id + "-num"}
              type="text"
              inputMode="decimal"
              aria-label={label}
              title="Klikk for å taste inn"
              value={draft !== null ? draft : display}
              onFocus={() => setDraft(formatDraft(value))}
              onChange={e => {
                const raw = e.target.value;
                setDraft(raw);
                const n = parseDraft(raw);
                if (n != null && n >= min && n <= max) onChange(n);
              }}
              onBlur={() => commitEdit(draft !== null ? draft : value)}
              onKeyDown={e => {
                if (e.key === "Enter") { e.currentTarget.blur(); }
                if (e.key === "Escape") { setDraft(null); e.currentTarget.blur(); }
              }}
              style={{
                ...valueStyle,
                width: Math.max(7, String(draft !== null ? draft : display).length) + "ch",
                maxWidth: "58%",
                border: "1px solid transparent", borderRadius: 6, background: "transparent",
                padding: "1px 6px", margin: 0, cursor: "text",
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = "#fff"; }}
              onMouseLeave={e => {
                if (document.activeElement === e.currentTarget) return;
                e.currentTarget.style.borderColor = "transparent";
                e.currentTarget.style.background = "transparent";
              }}
            />
          : <span style={valueStyle}>{display}</span>}
      </div>
      <input id={id} className="rng" type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(+e.target.value)} />
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, lineHeight: 1, marginTop: 2, color: C.text3 }}>
        <span>{minLabel}</span><span>{maxLabel}</span>
      </div>
    </div>
  );
}

/* X-akse med årsetiketter — tynnes ut ved lang løpetid */
function YearAxis({ years }) {
  const stepv = years <= 8 ? 1 : years <= 16 ? 2 : 5;
  const marks = [];
  for (let i = 0; i < years; i++) {
    if (i === 0 || i === years - 1 || ((i + 1) % stepv === 0 && i < years - 2)) marks.push(i);
  }
  return (
    <div style={{ position: "relative", height: 14, marginTop: 4, flex: "none" }}>
      {marks.map(i => {
        const first = i === 0, last = i === years - 1;
        const pos = first ? { left: 0 } : last ? { right: 0 } : { left: ((i + 0.5) / years * 100) + "%", transform: "translateX(-50%)" };
        return (
          <span key={i} style={{
            position: "absolute", top: 0, fontSize: 10, color: C.text3, whiteSpace: "nowrap", ...pos,
          }}>{"År " + (i + 1)}</span>
        );
      })}
    </div>
  );
}

/* Årsetiketter langs en termin-/kvartalsakse */
function TermYearAxis({ n, ppy }) {
  const years = Math.max(1, Math.ceil(n / ppy));
  const stepv = years <= 8 ? 1 : years <= 16 ? 2 : 5;
  const marks = [];
  for (let y = 0; y < years; y++) {
    if (y === 0 || y === years - 1 || ((y + 1) % stepv === 0 && y < years - 2)) marks.push(y);
  }
  return (
    <div style={{ position: "relative", height: 14, marginTop: 4, flex: "none" }}>
      {marks.map(y => {
        const start = y * ppy;
        const end = Math.min(n, (y + 1) * ppy);
        const mid = (start + end) / 2;
        const first = y === 0, last = y === years - 1;
        const pos = first ? { left: 0 }
          : last ? { right: 0 }
            : { left: (mid / n * 100) + "%", transform: "translateX(-50%)" };
        return (
          <span key={y} style={{
            position: "absolute", top: 0, fontSize: 10, color: C.text3, whiteSpace: "nowrap", ...pos,
          }}>{"År " + (y + 1)}</span>
        );
      })}
    </div>
  );
}

function ppyChartTitle(ppy) {
  if (ppy === 12) return "Renter og avdrag per måned";
  if (ppy === 6) return "Renter og avdrag per termin";
  if (ppy === 4) return "Renter og avdrag per kvartal";
  if (ppy === 2) return "Renter og avdrag per halvår";
  return "Renter og avdrag per år";
}

function termBarTitle(r, ppy) {
  const year = Math.ceil(r.m / ppy);
  const within = ((r.m - 1) % ppy) + 1;
  let when;
  if (ppy === 12) when = "År " + year + ", mnd " + within;
  else if (ppy === 4) when = "År " + year + ", K" + within;
  else if (ppy === 2) when = "År " + year + ", H" + within;
  else if (ppy === 1) when = "År " + year;
  else when = "Termin " + r.m;
  return when + " · renter " + nok(r.interest) + " · avdrag " + nok(r.principal);
}

/* ============================================================================
   Stablet søylediagram — renter og avdrag (per termin / valgt frekvens)
   ========================================================================== */
function StackedBars({ plan, ppy = 12, normalize }) {
  /* Én søyle per termin, slik at kvartalsvis/månedlig osv. speiler valget */
  const data = plan.rows;
  const max = Math.max(...data.map(r => r.term), 1);
  const n = data.length;
  const gap = n > 60 ? 1 : n > 20 ? 2 : 4;
  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        {!normalize && (
          <div style={{
            width: 74, flex: "none", display: "flex", flexDirection: "column", justifyContent: "space-between",
            fontSize: 10, color: C.text3, textAlign: "right", padding: "0 0 1px",
          }}>
            <span>{nok(max)}</span><span>{nok(max / 2)}</span><span>0 kr</span>
          </div>
        )}
        <div style={{
          position: "relative", flex: 1, minWidth: 0, display: "flex", alignItems: "flex-end",
          gap, borderBottom: "1px solid " + C.inputBorder,
        }}>
          {!normalize && (
            <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
              <div style={{ position: "absolute", left: 0, right: 0, top: 0, height: 1, background: C.border }} />
              <div style={{ position: "absolute", left: 0, right: 0, top: "50%", height: 1, background: C.border }} />
            </div>
          )}
          {data.map(r => {
            const h = normalize ? 100 : (r.term / max) * 100;
            const iShare = r.term > 0 ? r.interest / r.term * 100 : 0;
            return (
              <div key={r.m} title={termBarTitle(r, ppy)}
                style={{
                  flex: 1, minWidth: 0, height: h + "%", display: "flex", flexDirection: "column",
                  justifyContent: "flex-end", borderRadius: n > 40 ? 1 : 3, overflow: "hidden", position: "relative",
                }}>
                <div style={{ height: iShare + "%", background: C.blue2 }} />
                <div style={{ height: (100 - iShare) + "%", background: C.blue }} />
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ paddingLeft: normalize ? 0 : 82 }}>
        <TermYearAxis n={n} ppy={ppy} />
      </div>
    </div>
  );
}

/* ============================================================================
   Stablet søylediagram — akkumulerte renter, avdrag og gebyrer
   ========================================================================== */
function CumulativeBars({ plan, s }) {
  const feePer = s.fee || 0;
  const setupDeed = (s.setup || 0) + (s.deed || 0);
  let cInt = 0, cPrin = 0, cFees = 0;
  const data = plan.years.map((y, i) => {
    cInt += y.interest;
    cPrin += y.principal;
    cFees += y.chunk.length * feePer + (i === 0 ? setupDeed : 0);
    return {
      year: y.year,
      interest: cInt,
      principal: cPrin,
      fees: cFees,
      total: cInt + cPrin + cFees,
    };
  });
  const max = Math.max(...data.map(d => d.total), plan.totalPaid || 1);
  const nYears = data.length;
  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 74, flex: "none", display: "flex", flexDirection: "column", justifyContent: "space-between",
          fontSize: 10, color: C.text3, textAlign: "right", padding: "0 0 1px",
        }}>
          <span>{nok(max)}</span><span>{nok(max / 2)}</span><span>0 kr</span>
        </div>
        <div style={{
          position: "relative", flex: 1, minWidth: 0, display: "flex", alignItems: "flex-end",
          gap: nYears > 20 ? 2 : 4, borderBottom: "1px solid " + C.inputBorder,
        }}>
          <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
            <div style={{ position: "absolute", left: 0, right: 0, top: 0, height: 1, background: C.border }} />
            <div style={{ position: "absolute", left: 0, right: 0, top: "50%", height: 1, background: C.border }} />
          </div>
          {data.map(d => {
            const h = d.total / max * 100;
            const iShare = d.total > 0 ? d.interest / d.total * 100 : 0;
            const fShare = d.total > 0 ? d.fees / d.total * 100 : 0;
            const pShare = Math.max(0, 100 - iShare - fShare);
            return (
              <div key={d.year}
                title={"År " + d.year
                  + " · renter " + nok(d.interest)
                  + " · avdrag " + nok(d.principal)
                  + " · gebyrer " + nok(d.fees)
                  + " · totalt " + nok(d.total)}
                style={{
                  flex: 1, minWidth: 0, height: h + "%", display: "flex", flexDirection: "column",
                  justifyContent: "flex-end", borderRadius: 3, overflow: "hidden", position: "relative",
                }}>
                <div style={{ height: fShare + "%", background: C.sec800, minHeight: fShare > 0 ? 1 : 0 }} />
                <div style={{ height: iShare + "%", background: C.blue2, minHeight: iShare > 0 ? 1 : 0 }} />
                <div style={{ height: pShare + "%", background: C.blue, minHeight: pShare > 0 ? 1 : 0 }} />
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ paddingLeft: 82 }}><YearAxis years={nYears} /></div>
    </div>
  );
}

/* ============================================================================
   Søylediagram — restgjeld og betalt totalt per år
   ========================================================================== */
function DebtBars({ plan, s }) {
  const max = Math.max(s.amount, plan.totalPaid, 1);
  const one = s.setup + s.deed;
  let cum = one;
  const data = plan.years.map(y => {
    cum += y.term;
    return { year: y.year, balance: y.balance, paid: cum };
  });
  const nYears = data.length;
  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 78, flex: "none", display: "flex", flexDirection: "column", justifyContent: "space-between",
          fontSize: 10, color: C.text3, textAlign: "right", padding: "0 0 1px",
        }}>
          <span>{nok(max)}</span><span>{nok(max / 2)}</span><span>0 kr</span>
        </div>
        <div style={{
          position: "relative", flex: 1, minWidth: 0, display: "flex", alignItems: "flex-end",
          gap: nYears > 20 ? 3 : 5, borderBottom: "1px solid " + C.inputBorder,
        }}>
          <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
            <div style={{ position: "absolute", left: 0, right: 0, top: 0, height: 1, background: C.border }} />
            <div style={{ position: "absolute", left: 0, right: 0, top: "50%", height: 1, background: C.border }} />
          </div>

            <div key={d.year}
              title={"År " + d.year + " · restgjeld " + nok(d.balance) + " · betalt totalt " + nok(d.paid)}
              style={{ flex: 1, minWidth: 0, height: "100%", display: "flex", alignItems: "flex-end", gap: 2 }}>

                flex: 1, minWidth: 0, height: (d.balance / max * 100) + "%",
                background: C.blue, borderRadius: "3px 3px 0 0",
              }} />

                background: C.text3, borderRadius: "3px 3px 0 0",

}

/* ============================================================================
   Rentekurve — dragbar
   ========================================================================== */
function RateCurve({ s, setYearRates, disabled, disabledHint }) {
  const boxRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  /* Året man griper og rentebanen slik den var før grepet, slik at dragingen
     bare flytter nivået på dette trinnet og lar tidligere trinn stå */
  const fromRef = useRef(0);
  const baseRef = useRef(null);
  const list = disabled ? new Array(s.years).fill(s.rate) : yearRateList(s);
  const segs = rateSegments(list);

  const paint = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const cs = window.getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const padT = parseFloat(cs.paddingTop) || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    const w = rect.width - padL - padR, h = rect.height - padT - padB;
    if (!(w > 0) || !(h > 0)) return;
    const x = e.clientX - rect.left - padL;
    const y = e.clientY - rect.top - padT;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    let r = (1 - y / h) * 15;
    if (!Number.isFinite(r)) return;
    r = Math.max(0, Math.min(15, Math.round(r / 0.05) * 0.05));
    /* En renteendring varer ut løpetiden – ellers ville renten hoppet tilbake etter ett år */
    const next = (baseRef.current || list).slice();
    for (let i = fromRef.current; i < next.length; i++) next[i] = r;
    setYearRates(next);
  };

  const grab = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return;
    const cs = window.getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const w = rect.width - padL - (parseFloat(cs.paddingRight) || 0);
    if (!(w > 0)) return;
    const x = e.clientX - rect.left - padL;
    if (!Number.isFinite(x)) return;
    fromRef.current = Math.max(0, Math.min(s.years - 1, Math.floor(x / w * s.years)));
    baseRef.current = list.slice();
  };

  const labels = segs
    .map(sg => ({ ...sg, span: sg.end - sg.start + 1 }))
    .filter(sg => sg.span / s.years >= 0.16)
    .sort((a, b) => b.span - a.span)
    .slice(0, 3);

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, gap: 6 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 44, flex: "none", display: "flex", flexDirection: "column",
          justifyContent: "space-between", fontSize: 10, color: C.text3, textAlign: "right",
          padding: "0 0 2px",
        }}>
          <span>15,00 %</span><span>7,50 %</span><span>0 %</span>
        </div>
        <div ref={boxRef}
          onPointerDown={disabled ? undefined : e => {
            e.currentTarget.setPointerCapture?.(e.pointerId);
            setDragging(true); grab(e); paint(e);
          }}
          onPointerMove={disabled ? undefined : e => { if (dragging) paint(e); }}
          onPointerUp={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          onPointerLeave={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          style={{
            flex: 1, minWidth: 0, position: "relative", background: C.zebra,
            border: "1px solid " + C.border, borderRadius: 8, padding: 8,
            display: "flex", alignItems: "flex-end", gap: 3,
            touchAction: "none", userSelect: "none", cursor: disabled ? "default" : "ns-resize",
          }}>
          {list.map((r, i) => (
            <div key={i} title={disabled ? undefined : "År " + (i + 1) + " · " + pct(r)}
              style={{
                flex: 1, minWidth: 0, height: Math.max(0, r / 15 * 100) + "%",
                background: disabled ? "#F4F6F8" : C.blueSoft,
                borderTop: "3px solid " + (disabled ? C.inputBorder : C.blue),
              }} />
          ))}
          {disabled && (
            <div style={{
              position: "absolute", left: 0, right: 0, top: "38%", textAlign: "center",
              fontSize: 12, color: C.text2, pointerEvents: "none", padding: "0 24px",
            }}>
              {disabledHint || (
                <React.Fragment>
                  Slå på for å sette renten fra et valgt år og ut løpetiden.<br />Grunnplanen bruker flat rente på {pct(s.rate)}.
                </React.Fragment>
              )}
            </div>
          )}
          <div style={{ position: "absolute", inset: 8, pointerEvents: "none" }}>
            {!disabled && labels.map(sg => {
              const right = sg.start / s.years >= 0.82;
              return (
                <div key={sg.start} style={{
                  position: "absolute",
                  left: sg.start / s.years * 100 + "%",
                  width: sg.span / s.years * 100 + "%",
                  bottom: "calc(" + Math.max(0, sg.rate / 15 * 100) + "% + 5px)",
                  textAlign: right ? "right" : "center",
                  fontSize: 11.5, fontWeight: 600, color: C.blue, whiteSpace: "nowrap",
                }}>{pct(sg.rate)}</div>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{ paddingLeft: 52 }}><YearAxis years={s.years} /></div>
      <Help style={{ paddingLeft: 52 }}>
        {segs.length === 1
          ? "Flat rente på " + pct(segs[0].rate) + " gjennom hele løpetiden."
          : segs.length <= 6
            ? segs.map(sg => "år " + (sg.start + 1) + (sg.end > sg.start ? "–" + (sg.end + 1) : "") + ": " + pct(sg.rate)).join(" · ")
            : segs.length + " renteperioder, fra " + pct(Math.min(...list)) + " til " + pct(Math.max(...list)) + "."}
      </Help>
    </div>
  );
}

/* Nibor + påslag — viser den resulterende rentebanen (skrivebeskyttet) */
function niborAxisRange(rates) {
  const lo = Math.min(...rates);
  const hi = Math.max(...rates);
  const span = Math.max(hi - lo, 0.15);
  const pad = Math.max(0.06, span * 0.35);
  const step = span < 0.5 ? 0.05 : 0.1;
  let yMin = Math.floor((lo - pad) / step) * step;
  let yMax = Math.ceil((hi + pad) / step) * step;
  if (yMax - yMin < 0.35) {
    const mid = (lo + hi) / 2;
    yMin = Math.floor((mid - 0.18) / step) * step;
    yMax = Math.ceil((mid + 0.18) / step) * step;
  }
  return { yMin, yMax };
}

const pct3 = v => (Number.isFinite(v) ? v : 0).toFixed(3).replace(".", ",") + " %";

/* Nøkkelpunkter i kurven: 1 / 3 / 5 / 10 år – øvrige søyler deler samme blå */
const NIBOR_MARK_YEARS = [1, 3, 5, 10];
const NIBOR_MARK_COLORS = {
  1: { fill: "#D1FADF", top: "#027A48", label: "1 år" },
  3: { fill: "#FEF0C7", top: "#B54708", label: "3 år" },
  5: { fill: "#E0F2FE", top: "#026AA2", label: "5 år" },
  10: { fill: "#D6E4F7", top: "#002359", label: "10 år" },
};
const NIBOR_DEFAULT_BAR = { fill: C.blueSoft, top: C.blue };

function niborBarStyle(year, disabled) {
  if (disabled) return { fill: "#F4F6F8", top: C.inputBorder };
  if (NIBOR_MARK_COLORS[year]) return NIBOR_MARK_COLORS[year];
  return NIBOR_DEFAULT_BAR;
}

function NiborCurve({ s, curve, disabled }) {
  const margin = Number(s.niborMargin) || 0;
  const list = disabled
    ? new Array(s.years).fill(s.rate)
    : niborYearList(s, curve);
  const holdYears = Math.max(0, s.years - 10);
  const base10 = interpolateNibor(curve, 10);
  const y10 = base10 + margin;
  const { yMin, yMax } = disabled
    ? { yMin: 0, yMax: 15 }
    : niborAxisRange(list);
  const yMid = (yMin + yMax) / 2;
  const barPct = r => Math.max(0, Math.min(100, ((r - yMin) / (yMax - yMin)) * 100));

  const hoverTitle = i => {
    const year = i + 1;
    const total = list[i];
    if (disabled) return "År " + year + " · " + pct3(total);
    const fromCurve = year <= 10;
    const base = fromCurve ? interpolateNibor(curve, year) : base10;
    const mark = NIBOR_MARK_COLORS[year] ? " · nøkkelpunkt " + NIBOR_MARK_COLORS[year].label : "";
    if (fromCurve) {
      return "År " + year + mark + " · kurve " + pct3(base)
        + (margin ? " + påslag " + pct(margin) : "")
        + " = " + pct3(total);
    }
    return "År " + year + " · 10-års nivå " + pct3(base10)
      + (margin ? " + påslag " + pct(margin) : "")
      + " = " + pct3(total) + " (gjelder alle år etter år 10)";
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, gap: 6 }}>
      {!disabled && (
        <div style={{
          display: "flex", alignItems: "center", flexWrap: "wrap", gap: "6px 12px", flex: "none",
          fontSize: 10.5, color: C.text2, paddingLeft: 52,
        }}>
          {NIBOR_MARK_YEARS.map(y => (
            <span key={y} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
              <span style={{
                width: 10, height: 10, borderRadius: 2, flex: "none",
                background: NIBOR_MARK_COLORS[y].top,
              }} />
              {NIBOR_MARK_COLORS[y].label}
            </span>
          ))}
          <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: C.blue, flex: "none" }} />
            Øvrige år
          </span>
        </div>
      )}
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 44, flex: "none", display: "flex", flexDirection: "column",
          justifyContent: "space-between", fontSize: 10, color: C.text3, textAlign: "right",
          padding: "0 0 2px",
        }}>
          <span>{pct(yMax)}</span>
          <span>{pct(yMid)}</span>
          <span>{pct(yMin)}</span>
        </div>
        <div style={{
          flex: 1, minWidth: 0, position: "relative", background: C.zebra,
          border: "1px solid " + C.border, borderRadius: 8, padding: 8,
          display: "flex", alignItems: "flex-end", gap: 2,
        }}>
          {list.map((r, i) => {
            const year = i + 1;
            const style = niborBarStyle(year, disabled);
            return (
              <div key={i} title={hoverTitle(i)}
                style={{
                  flex: 1, minWidth: 0, height: barPct(r) + "%",
                  background: style.fill,
                  borderTop: "3px solid " + style.top,
                  cursor: "default",
                }} />
            );
          })}
          {!disabled && holdYears > 0 && (
            <div title={"Skille: rentekurve (år 1–10) | fast 10-års nivå (" + pct3(y10) + ")"}
              style={{
                position: "absolute", top: 8, bottom: 8,
                left: "calc(8px + (100% - 16px) * " + (10 / s.years) + ")",
                width: 0, borderLeft: "1px dashed " + C.blueMuted,
                pointerEvents: "none", zIndex: 2,
              }} />
          )}
          {disabled && (
            <div style={{
              position: "absolute", left: 0, right: 0, top: "38%", textAlign: "center",
              fontSize: 12, color: C.text2, pointerEvents: "none", padding: "0 24px",
            }}>
              Slå på for å koble lånerenten til Nibor-kurven + påslag.
            </div>
          )}
          {!disabled && (
            <div style={{
              position: "absolute", left: 10, top: 8, fontSize: 10, fontWeight: 600,
              color: C.blue, pointerEvents: "none", maxWidth: "42%",
            }}>
              Kurve
            </div>
          )}
          {!disabled && holdYears > 0 && (
            <div style={{
              position: "absolute", top: 8, fontSize: 10, fontWeight: 600,
              color: C.blueMuted, pointerEvents: "none", whiteSpace: "nowrap",
              left: "calc(8px + (100% - 16px) * " + (10 / s.years) + " + 6px)",
            }}>
              Fast 10-års
            </div>
          )}
        </div>
      </div>
      <div style={{ paddingLeft: 52 }}><YearAxis years={s.years} /></div>
      <Help style={{ paddingLeft: 52 }}>
        {disabled
          ? "Kurven hentes fra nibor.txt (3 mnd–10 år). Etter år 10 brukes 10-års nivået (" + pct3(base10) + ")."
          : "Nøkkelpunkter 1 / 3 / 5 / 10 år er fargekodet. Øvrige år bruker samme blå. "
            + "Fra år 11 brukes 10-års punktet " + pct3(base10)
            + (margin ? " + " + pct(margin) + " = " + pct3(y10) : " = " + pct3(y10)) + "."}
      </Help>
    </div>
  );
}

/* Avdragsfrihet tegnes med samme grep som renten, men kurven har bare to nivåer:
   du tar tak i et år og drar opp eller ned, og valget gjelder derfra og ut løpetiden */
function GraceCurve({ s, setGraceYears, disabled }) {
  const boxRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const fromRef = useRef(0);
  const baseRef = useRef(null);
  const list = disabled ? graceFieldYears(s) : graceYearList(s);
  const segs = graceSegments(list);

  const paint = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const cs = window.getComputedStyle(el);
    const padT = parseFloat(cs.paddingTop) || 0;
    const h = rect.height - padT - (parseFloat(cs.paddingBottom) || 0);
    if (!(h > 0)) return;
    const y = e.clientY - rect.top - padT;
    if (!Number.isFinite(y)) return;
    const on = 1 - y / h >= 0.5;
    const next = (baseRef.current || list).slice();
    for (let i = fromRef.current; i < next.length; i++) next[i] = on;
    setGraceYears(next);
  };

  const grab = e => {
    const el = boxRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return;
    const cs = window.getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const w = rect.width - padL - (parseFloat(cs.paddingRight) || 0);
    if (!(w > 0)) return;
    const x = e.clientX - rect.left - padL;
    if (!Number.isFinite(x)) return;
    fromRef.current = Math.max(0, Math.min(s.years - 1, Math.floor(x / w * s.years)));
    baseRef.current = list.slice();
  };

  const on = segs.filter(sg => sg.on);
  const count = list.reduce((a, v) => a + (v ? 1 : 0), 0);
  const spans = on.map(sg => "år " + (sg.start + 1) + (sg.end > sg.start ? "–" + (sg.end + 1) : ""));
  /* Løpetiden ligger fast. Serielån fordeler avdrag jevnt over år med nedbetaling;
     avdragsfrihet på slutten uten nok avdrag foran kan gi restgjeld. */
  const note = (count === 0
    ? "Ingen avdragsfrihet – avdrag fra første termin."
    : "Avdragsfri " + (spans.length <= 4 ? spans.join(" · ") : count + " av " + s.years + " år") + ". "
      + (count === s.years
        ? "Ingen avdrag i hele løpetiden – restgjelden står urørt."
        : list[list.length - 1]
          ? "Avdragsfrihet på slutten: uten nok avdragsterminer foran kan restgjelden bli stående."
          : "Avdrag fordeles over årene med nedbetaling; avdragsfrie år er kun renter."))
    + (!disabled && s.graceYears && graceTerms(s) > 0
      ? " Overstyrer de " + s.grace + " " + s.graceUnit + " i Lån-fanen." : "");

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, gap: 6 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 44, flex: "none", display: "flex", flexDirection: "column",
          justifyContent: "space-between", fontSize: 9.5, color: C.text3, textAlign: "right",
          padding: "0 0 2px",
        }}>
          <span>Avdragsfri</span><span>Avdrag</span>
        </div>
        <div ref={boxRef}
          onPointerDown={disabled ? undefined : e => {
            e.currentTarget.setPointerCapture?.(e.pointerId);
            setDragging(true); grab(e); paint(e);
          }}
          onPointerMove={disabled ? undefined : e => { if (dragging) paint(e); }}
          onPointerUp={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          onPointerLeave={disabled ? undefined : () => { setDragging(false); baseRef.current = null; }}
          style={{
            flex: 1, minWidth: 0, position: "relative", background: C.zebra,
            border: "1px solid " + C.border, borderRadius: 8, padding: 8,
            display: "flex", alignItems: "flex-end", gap: 3,
            touchAction: "none", userSelect: "none", cursor: disabled ? "default" : "ns-resize",
          }}>
          {list.map((v, i) => (
            <div key={i} title={disabled ? undefined : "År " + (i + 1) + " · " + (v ? "avdragsfri" : "med avdrag")}
              style={{
                flex: 1, minWidth: 0, height: v ? "100%" : "10%",
                background: disabled ? "#F4F6F8" : v ? C.blueSoft : C.track,
                borderTop: "3px solid " + (disabled ? C.inputBorder : v ? C.blue : C.inputBorder),
              }} />
          ))}
          {disabled && (
            <div style={{
              position: "absolute", left: 0, right: 0, top: "38%", textAlign: "center",
              fontSize: 12, color: C.text2, pointerEvents: "none", padding: "0 24px",
            }}>
              Slå på for å velge avdragsfrihet fra et valgt år og ut løpetiden.<br />
              {graceTerms(s) > 0
                ? "Grunnplanen har " + s.grace + " " + s.graceUnit + " avdragsfrihet."
                : "Grunnplanen har avdrag fra første termin."}
            </div>
          )}
          <div style={{ position: "absolute", inset: 8, pointerEvents: "none" }}>
            {!disabled && on.filter(sg => (sg.end - sg.start + 1) / s.years >= 0.18).map(sg => (
              <div key={sg.start} style={{
                position: "absolute", top: 7,
                left: sg.start / s.years * 100 + "%",
                width: (sg.end - sg.start + 1) / s.years * 100 + "%",
                textAlign: "center", fontSize: 11.5, fontWeight: 600, color: C.blue, whiteSpace: "nowrap",
              }}>Avdragsfri</div>
            ))}
          </div>
        </div>
      </div>
      <div style={{ paddingLeft: 52 }}><YearAxis years={s.years} /></div>
      <Help style={{ paddingLeft: 52 }}>{note}</Help>
    </div>
  );
}

/* ============================================================================
   Søylediagram — belåningsgrad per år
   ========================================================================== */
/* Nivåene lånet er verdt å følge med på */
const LTV_MARKS = [90, 80, 60];

function LtvBars({ plan, extraPlan, s, startLTV }) {
  const data = plan.years.map((y, i) => {
    const a = assetAt(s, (i + 1) * s.ppy);
    const extra = extraPlan && extraPlan.years[i] ? extraPlan.years[i].balance : 0;
    return { year: i + 1, age: s.age + i + 1, ltv: a > 0 ? (y.balance + extra) / a * 100 : 0 };
  });
  const top = Math.max(100, startLTV, ...data.map(d => d.ltv));
  const H = v => Math.max(0, Math.min(1, v / top)) * 100;
  const band = v => v > 90 ? C.navy : v > 80 ? C.blue : v > 60 ? C.blue2 : C.blueSoft;

  /* Året lånet først faller under hvert nivå. Merkelappen henges på nivålinjen,
     så to nivåer som passeres samme år ikke legger seg oppå hverandre. */
  const crossings = [];
  LTV_MARKS.forEach(mark => {
    if (startLTV <= mark) return;
    const i = data.findIndex(d => d.ltv <= mark);
    if (i >= 0) crossings.push({ mark, i, age: data[i].age });
  });
  const crossYears = new Set(crossings.map(c => c.i));

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style={{
        position: "relative", flex: 1, minHeight: 96, display: "flex", alignItems: "flex-end",
        gap: data.length > 20 ? 2 : 4, borderBottom: "1px solid " + C.inputBorder,
      }}>
        {LTV_MARKS.map(t => (
          <div key={t} style={{
            position: "absolute", left: 0, right: 0, bottom: H(t) + "%",
            borderTop: "1px dashed " + C.inputBorder, pointerEvents: "none",
          }} />
        ))}
        {data.map((d, i) => (
          <div key={d.year} title={"År " + d.year + " · " + d.age + " år · " + pct1(d.ltv)}
            style={{
              flex: 1, minWidth: 0, height: H(d.ltv) + "%", borderRadius: "3px 3px 0 0",
              background: band(d.ltv),
              /* ringen må vises både på de mørke og de lyse søylene */
              boxShadow: crossYears.has(i)
                ? "inset 0 0 0 1.5px " + (d.ltv > 80 ? "#fff" : C.navy) : "none",
            }} />
        ))}
        {LTV_MARKS.map(t => (
          <div key={"m" + t} style={{
            position: "absolute", right: 0, bottom: H(t) + "%", transform: "translateY(50%)",
            background: "#fff", padding: "0 3px", fontSize: 10.5, fontWeight: 600,
            color: C.text3, whiteSpace: "nowrap", pointerEvents: "none",
          }}>{t} %</div>
        ))}
        {crossings.map(c => {
          const end = (c.i + 0.5) / data.length > 0.78;
          return (
            <div key={"c" + c.mark} style={{
              position: "absolute", bottom: H(c.mark) + "%",
              ...(end
                ? { right: 26, transform: "translateY(50%)" }
                : { left: ((c.i + 0.5) / data.length * 100) + "%", transform: "translate(-50%, 50%)" }),
              background: "#fff", border: "1px solid " + C.blue2, borderRadius: 100,
              padding: "1px 7px", fontSize: 10.5, fontWeight: 600, color: C.blue,
              whiteSpace: "nowrap", pointerEvents: "none",
            }}>{c.mark} % ved {c.age} år</div>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: C.text3, marginTop: 4 }}>
        <span>{s.age} år</span><span>{s.age + s.years} år</span>
      </div>
    </div>
  );
}

/* ============================================================================
   Stresstest — andel av bruttoinntekt til renter og avdrag
   ========================================================================== */
function StressChart({ points, income }) {
  const peak = Math.max(...points.map(p => p.share), STRESS_LIMIT + 10, 50);
  const top = Math.ceil(peak / 10) * 10;
  const H = v => Math.max(0, Math.min(1, v / top)) * 100;
  const axis = [top, top / 2, 0];

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style={{ display: "flex", gap: 8, flex: 1, minHeight: 0 }}>
        <div style={{
          width: 44, flex: "none", display: "flex", flexDirection: "column", justifyContent: "space-between",
          fontSize: 10, color: C.text3, textAlign: "right", padding: "0 0 1px",
        }}>
          {axis.map((v, i) => <span key={i}>{Math.round(v)} %</span>)}
        </div>
        <div style={{
          position: "relative", flex: 1, minWidth: 0, display: "flex", alignItems: "flex-end",
          gap: 8, borderBottom: "1px solid " + C.inputBorder, padding: "0 2px",
        }}>
          {/* Soft and hard limits */}
          <div style={{
            position: "absolute", left: 0, right: 0, bottom: H(STRESS_SOFT) + "%",
            borderTop: "1px dashed " + C.inputBorder, pointerEvents: "none",
          }} />
          <div style={{
            position: "absolute", left: 0, right: 0, bottom: H(STRESS_LIMIT) + "%",
            borderTop: "1.5px solid " + C.red, pointerEvents: "none",
          }} />
          <div style={{
            position: "absolute", right: 0, bottom: H(STRESS_LIMIT) + "%", transform: "translateY(50%)",
            background: "#fff", padding: "0 4px", fontSize: 10.5, fontWeight: 600, color: C.red,
            whiteSpace: "nowrap", pointerEvents: "none",
          }}>Limit {STRESS_LIMIT} %</div>
          <div style={{
            position: "absolute", right: 0, bottom: H(STRESS_SOFT) + "%", transform: "translateY(50%)",
            background: "#fff", padding: "0 4px", fontSize: 10.5, fontWeight: 600, color: C.text3,
            whiteSpace: "nowrap", pointerEvents: "none",
          }}>Stramt {STRESS_SOFT} %</div>

          {points.map(p => {
            const h = H(p.share);
            const iShare = p.paid > 0 ? p.interest / p.paid * 100 : 0;
            const over = p.share > STRESS_LIMIT;
            const rule = p.shock === STRESS_RULE;
            return (
              <div key={p.shock} title={
                (p.shock === 0 ? "I dag" : "+" + p.shock + " pp")
                + " · " + pct1(p.share) + " av inntekt"
                + " · renter " + nok(p.interest) + " · avdrag " + nok(p.principal)
              } style={{
                flex: 1, minWidth: 0, height: h + "%", display: "flex", flexDirection: "column",
                justifyContent: "flex-end", borderRadius: "4px 4px 0 0", overflow: "hidden",
                boxShadow: rule ? "inset 0 0 0 2px " + C.navy : "none",
                opacity: income > 0 ? 1 : 0.35,
              }}>
                <div style={{ height: iShare + "%", background: over ? "#F97066" : C.blue2, minHeight: iShare > 0 ? 2 : 0 }} />
                <div style={{ height: (100 - iShare) + "%", background: over ? C.red : C.blue, minHeight: (100 - iShare) > 0 ? 2 : 0 }} />
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
        <div style={{ width: 44, flex: "none" }} />
        <div style={{ flex: 1, display: "flex", gap: 8 }}>
          {points.map(p => (
            <div key={p.shock} style={{
              flex: 1, textAlign: "center", fontSize: 11, fontWeight: p.shock === STRESS_RULE ? 700 : 500,
              color: p.shock === STRESS_RULE ? C.navy : C.text2, whiteSpace: "nowrap",
            }}>
              {p.shock === 0 ? "I dag" : "+" + p.shock}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Nedbetalingstabell
   ========================================================================== */
function PlanTable({ plan, s, view, showRate }) {
  const rows = makeTable(plan, s, view);
  const startAmount = plan.amount != null ? plan.amount : s.amount;
  const endBal = plan.rows.length ? plan.rows[plan.rows.length - 1].balance : 0;
  const principalSum = Math.max(0, startAmount - endBal);
  const showTop = rows.some(r => r.topBalance != null);
  const cols = [
    "År", "Termin",
    ...(showRate ? ["Rente"] : []),
    "Avdrag", "Renter", "Gebyrer", "Sum betaling",
    ...(showTop ? ["Topplån"] : []),
    "Restgjeld",
  ];
  const padOf = i => ({ paddingLeft: i === 0 ? 24 : 10, paddingRight: i === cols.length - 1 ? 24 : 10 });
  const headSpan = 2 + (showRate ? 1 : 0);
  return (
    <div style={{ flex: 1, minHeight: 0, overflow: "auto" }}>
      <table className="tbl">
        <thead>
          <tr>{cols.map((c, i) => <th key={c} className={i < 2 ? "l" : ""} style={padOf(i)}>{c}</th>)}</tr>
        </thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.key} style={{
              background: r.bg,
              boxShadow: r.isTop ? "inset 3px 0 0 " + C.blue : undefined,
            }}>
              <td className="l" style={{ paddingLeft: 24, color: C.text2 }}>{r.year}</td>
              <td className="l">
                {r.termin}
                {r.isTop && <TopPill />}
                {r.isGrace && <GracePill />}
              </td>
              {showRate && <td style={{ color: C.blue, fontWeight: 600 }}>{pct(r.rate)}</td>}
              <td>{nok(r.principal)}</td>
              <td>{nok(r.interest)}</td>
              <td style={{ color: C.text2 }}>{nok(r.fees)}</td>
              <td style={{ fontWeight: 600 }}>{nok(r.total)}</td>
              {showTop && (
                <td style={{
                  color: (r.topBalance || 0) > 0.5 ? "#5B9FFF" : C.text3,
                  fontWeight: (r.topBalance || 0) > 0.5 ? 600 : 500,
                }}>
                  {nok(r.topBalance || 0)}
                </td>
              )}
              <td style={{ paddingRight: 24 }}>
                {nok(r.balance)}
                <BalanceBar value={r.balancePct} topPct={r.topPct} mainPct={r.mainPct} />
              </td>
            </tr>
          ))}

        <tfoot>
          <tr>
            <td className="l" colSpan={headSpan} style={{ paddingLeft: 24, color: C.text2 }}>Sum</td>
            <td>{nok(principalSum)}</td>
            <td>{nok(plan.totalInterest)}</td>
            <td>{nok(plan.totalFees)}</td>

            <td style={{ paddingRight: 24, color: endBal > 0.5 ? C.red : undefined, fontWeight: endBal > 0.5 ? 600 : undefined }}>
              {nok(endBal)}
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  );
}

/* ============================================================================
   Input / output — lagre og gjenopprett alle felter via tekst

const IO_FIELDS = [

const TAB_NO = {

  adv: "Lån Avansert", more: "Avansert II", advplan: "Nedbetalingsplan avansert",
};
const TAB_FROM_NO = Object.fromEntries(Object.entries(TAB_NO).map(([k, v]) => [v.toLowerCase(), k]));

const jaNei = v => v ? "ja" : "nei";
const fromJaNei = v => {
  if (typeof v === "boolean") return v;
  if (typeof v === "number") return v !== 0;
  const t = String(v == null ? "" : v).trim().toLowerCase();
  return t === "ja" || t === "true" || t === "1" || t === "yes";
};

function exportValue(key, v) {
  if (key === "graceUnit") return v === "year" || v === "år" ? "år" : "måneder";
  if (key === "type") return v === "serie" ? "serielån" : "annuitet";
  if (key === "view") return v === "month" ? "per termin" : "per år";
  if (key === "tab") return TAB_NO[v] || TAB_NO.calc;
  if (key === "stepsOn" || key === "graceStepsOn" || key === "ltvOn" || key === "niborOn") return jaNei(v);
  if (key === "topRate") return v == null ? "automatisk (+2 %)" : v;
  if (key === "yearRates") return Array.isArray(v) ? v : null;
  if (key === "graceYears") return Array.isArray(v) ? v.map(jaNei) : null;
  return v;
}

function serializeExportValue(key, v) {
  const ev = exportValue(key, v);
  if (ev == null) return "null";
  if (Array.isArray(ev)) return JSON.stringify(ev);
  return String(ev);
}

function fieldLine(sentence, key, s) {
  const field = IO_FIELDS.find(f => f.key === key);
  return sentence + " " + field.no + ": " + serializeExportValue(key, s[key]);
}

function ppyLabel(ppy) {
  if (ppy === 12) return "månedlig (12 terminer per år)";
  if (ppy === 6) return "annenhver måned (6 terminer per år)";
  if (ppy === 4) return "kvartalsvis (4 terminer per år)";
  if (ppy === 2) return "halvårlig (2 terminer per år)";
  if (ppy === 1) return "årlig (1 termin per år)";
  return ppy + " terminer per år";
}

function describeRateSteps(s) {
  if (!s.stepsOn) return null;
  const list = yearRateList(s);
  const segs = rateSegments(list);
  if (segs.length === 1) return "Renten er satt til " + pct(segs[0].rate) + " gjennom hele løpetiden.";
  return "Renteendringer underveis er aktive. "
    + segs.map(sg => {
      const from = sg.start + 1;
      const to = sg.end + 1;
      return from === to
        ? "I år " + from + " er renten " + pct(sg.rate)
        : "Fra år " + from + " til år " + to + " er renten " + pct(sg.rate);
    }).join(". ") + ".";
}

function describeGraceSteps(s) {
  if (!s.graceStepsOn) return null;
  const list = graceYearList(s);
  const onYears = list.map((on, i) => on ? i + 1 : null).filter(Boolean);
  if (!onYears.length) return "Avdragsfrihet underveis er slått på, men ingen år er markert som avdragsfrie.";
  const spans = graceSegments(list).filter(sg => sg.on).map(sg =>
    sg.start === sg.end ? "år " + (sg.start + 1) : "år " + (sg.start + 1) + "–" + (sg.end + 1)
  );
  return "Avdragsfrihet underveis er tegnet for " + spans.join(", ") + ".";
}

    "topRate", s));

  return lines.join("\n");
}

function numOr(v, fallback) {
  if (typeof v === "string") v = v.replace(/\s/g, "").replace(",", ".");
  const n = typeof v === "number" ? v : Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function pickField(src, key, no) {
  if (no in src) return src[no];
  if (key in src) return src[key];
  return undefined;
}

function parseProseFields(text) {
  const src = {};
  const fields = IO_FIELDS.slice().sort((a, b) => b.no.length - a.no.length);
  fields.forEach(({ no }) => {
    const esc = no.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(esc + "\\s*:\\s*([^\\n]+)", "i");
    const m = text.match(re);
    if (!m) return;
    let raw = m[1].trim();
    if (/^null$/i.test(raw)) raw = null;
    else if (raw.charAt(0) === "[") {
      try { raw = JSON.parse(raw); } catch (e) { /* behold streng */ }
    }
    src[no] = raw;
  });
  return src;
}

function applyImportedFields(src) {
  const next = { ...DEFAULT_STATE };

  IO_FIELDS.forEach(({ key, no }) => {
    const v = pickField(src, key, no);
    if (v === undefined) return;

    if (key === "graceUnit") {
      const t = String(v).toLowerCase();
      next.graceUnit = (t === "year" || t === "år" || t === "aar" || t.indexOf("år") >= 0) ? "år" : "mnd";
      return;
    }
    if (key === "type") {
      const t = String(v).toLowerCase();
      next.type = t.indexOf("serie") >= 0 ? "serie" : "annuitet";
      return;
    }
    if (key === "view") {
      const t = String(v).toLowerCase();
      next.view = t.indexOf("termin") >= 0 || t === "month" ? "month" : "year";
      return;
    }
    if (key === "tab") {
      const t = String(v).trim().toLowerCase().replace(/[«»"]/g, "");
      next.tab = TAB_FROM_NO[t] || (TAB_IDS.includes(t) ? t : "calc");
      return;
    }
    if (key === "stepsOn" || key === "graceStepsOn" || key === "ltvOn" || key === "niborOn") {
      next[key] = fromJaNei(v);
      return;
    }
    if (key === "topRate") {
      if (v == null || v === "" || String(v).toLowerCase().indexOf("automatisk") >= 0) next.topRate = null;
      else next.topRate = numOr(v, null);
      return;
    }
    if (key === "yearRates") {
      if (v == null || v === "" || v === "null") next.yearRates = null;
      else if (Array.isArray(v)) next.yearRates = v;
      else if (typeof v === "string") {
        try { next.yearRates = JSON.parse(v); }
        catch (e) {
          next.yearRates = v.split(",").map(x => numOr(x.trim(), NaN)).filter(n => Number.isFinite(n));
          if (!next.yearRates.length) next.yearRates = null;
        }
      } else next.yearRates = null;
      return;
    }
    if (key === "graceYears") {
      if (v == null || v === "" || v === "null") next.graceYears = null;
      else if (Array.isArray(v)) next.graceYears = v.map(fromJaNei);
      else if (typeof v === "string") {
        try { next.graceYears = JSON.parse(v).map(fromJaNei); }
        catch (e) { next.graceYears = null; }
      } else next.graceYears = null;
      return;
    }
    next[key] = v;
  });

  next.amount = clamp(numOr(next.amount, DEFAULT_STATE.amount), 0, 100000000);
  next.rate = clamp(numOr(next.rate, DEFAULT_STATE.rate), 0, 30);
  next.years = clamp(Math.round(numOr(next.years, DEFAULT_STATE.years)), YEARS_MIN, YEARS_MAX);
  next.fee = clamp(numOr(next.fee, DEFAULT_STATE.fee), 0, 10000);
  next.setup = clamp(numOr(next.setup, DEFAULT_STATE.setup), 0, 1000000);
  next.deed = clamp(numOr(next.deed, DEFAULT_STATE.deed), 0, 1000000);
  next.ppy = PPY_OPTS.includes(+next.ppy) ? +next.ppy : DEFAULT_STATE.ppy;
  next.graceUnit = next.graceUnit === "year" || next.graceUnit === "år" ? "år" : "mnd";
  next.grace = clamp(Math.round(numOr(next.grace, 0)), 0, graceMaxFor(next.graceUnit, next.years));
  next.type = next.type === "serie" ? "serie" : "annuitet";
  next.view = next.view === "month" ? "month" : "year";
  next.tab = TAB_IDS.includes(next.tab) ? next.tab : "calc";
  next.stepsOn = !!next.stepsOn;
  next.graceStepsOn = !!next.graceStepsOn;
  next.ltvOn = !!next.ltvOn;
  next.niborOn = !!next.niborOn;
  next.niborMargin = clamp(numOr(next.niborMargin, DEFAULT_STATE.niborMargin), 0, 8);
  next.age = clamp(Math.round(numOr(next.age, DEFAULT_STATE.age)), 18, 80);
  next.debtFreeAge = next.age + next.years;
  next.assetValue = clamp(numOr(next.assetValue, DEFAULT_STATE.assetValue), 0, 200000000);
  next.income = clamp(numOr(next.income, DEFAULT_STATE.income), 0, 100000000);
  next.extraAsset = clamp(numOr(next.extraAsset, 0), 0, 50000000);
  next.topAmount = clamp(numOr(next.topAmount, 0), 0, 50000000);
  if (next.topRate == null || next.topRate === "") next.topRate = null;
  else next.topRate = clamp(numOr(next.topRate, next.rate + 2), 0, 15);

  if (Array.isArray(next.yearRates) && next.yearRates.length) {
    next.yearRates = next.yearRates.map(r => clamp(numOr(r, next.rate), 0, 30));
    while (next.yearRates.length < next.years) next.yearRates.push(next.yearRates[next.yearRates.length - 1]);
    next.yearRates = next.yearRates.slice(0, next.years);
  } else {
    next.yearRates = null;
  }
  if (!next.stepsOn) next.yearRates = null;
  if (next.niborOn) {
    next.stepsOn = false;
    next.yearRates = null;
  }

  if (Array.isArray(next.graceYears) && next.graceYears.length) {
    next.graceYears = next.graceYears.map(fromJaNei);
    while (next.graceYears.length < next.years) next.graceYears.push(false);
    next.graceYears = next.graceYears.slice(0, next.years);
  } else {
    next.graceYears = null;
  }
  if (!next.graceStepsOn) next.graceYears = null;

  next.grace = Math.min(next.grace, graceMaxFor(next.graceUnit, next.years));
  return next;
}

function importState(text) {
  const trimmed = String(text || "").trim();
  if (!trimmed) throw new Error("Ugyldig format");

  if (trimmed.charAt(0) === "{") {
    const raw = JSON.parse(trimmed);
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("Ugyldig format");
    const src = raw.state && typeof raw.state === "object" ? raw.state : raw;
    return applyImportedFields(src);
  }

  const src = parseProseFields(trimmed);
  if (!Object.keys(src).length) throw new Error("Ugyldig format");
  return applyImportedFields(src);
}
